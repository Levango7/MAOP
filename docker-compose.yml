# MAOP / MAOS — Cloud-Native Microservice Deployment
#
# 品牌定位:
#   MAOP (Multi-Agent Orchestration Platform) — 个人版, 免费开源
#   MAOS (Multi-Agent Orchestration Suite)    — 企业版, 需 License
#
# Services:
#   dashboard     — FastAPI web UI + API gateway
#   agent-exec    — Agent execution worker (dispatches to LLM drivers)
#   queue-worker  — Background queue consumer (human approval, async tasks)
#   db            — Storage: SQLite (MAOP Personal, single-process) | PostgreSQL (MAOS Enterprise, --profile postgres)
#
# Quick start:  docker compose up -d
# With OTel:    docker compose --profile otel up -d
# With TLS:     docker compose --profile tls up -d
#
# Environment variables (see .env.example):
#   MAOP_DASH_PORT, MAOP_LOG_LEVEL, MAOP_AUTH, etc.
#
# t15 (2026-07-21): This is the single source of truth for MAOP docker
# compose. The previous duplicate at py/docker-compose.yml has been removed
# (its build context and volume paths were broken when launched from py/
# because ./config and ./nginx.conf are relative to the compose file).
# Always run `docker compose` from the repo root.

# Storage architecture (T2-10 revised 2026-07-27):
#   MAOP Personal (no license) → SQLite, single-process or this multi-service demo compose.
#     SQLite WAL supports 1 writer + N readers; for multi-container demo only.
#   MAOS Enterprise (with license) → PostgreSQL via --profile postgres.
#     Production multi-writer workloads MUST use PostgreSQL, not SQLite coordination layers.

# 3f335fb: shared build block (YAML anchor) — all three MAOP services build
# the same Dockerfile with the same base-image args. Previously only the
# dashboard service passed build args; agent-exec and queue-worker fell back
# to the Dockerfile's bare defaults (docker.io), which broke CN-local builds
# and left the CI compose-smoke dependent on per-service overrides.
x-maop-build: &maop-build
  context: .
  dockerfile: py/Dockerfile
  args:
    # Docker Hub defaults; override via env for CN-local mirror registries
    # (e.g. docker.m.daocloud.io/library/...). The compose-smoke CI job sets
    # these explicitly.
    PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
    NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}

services:
  # ── PostgreSQL (optional, --profile postgres) ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maop
      POSTGRES_USER: maop
      # O-5 fix: no default password. Operators MUST set MAOP_PG_PASSWORD
      # (or POSTGRES_PASSWORD) — silently using "maop_dev" in production
      # is a security risk. Local dev can set MAOP_PG_PASSWORD=maop_dev
      # in .env to preserve the previous behavior.
      POSTGRES_PASSWORD: ${MAOP_PG_PASSWORD:?Set MAOP_PG_PASSWORD in .env (use "maop_dev" for local dev)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maop -d maop"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["postgres"]  # 可选 profile，默认不启动

  # ── Dashboard (API + Web UI) ────────────────────────────────────
  dashboard:
    build: *maop-build
    container_name: maop-dashboard
    ports:
      - "${MAOP_DASH_PORT:-9079}:9079"
    volumes:
      - maop-data:/app/data
      - maop-logs:/app/logs
      - ./config:/app/config:ro
    environment:
      - MAOP_ROOT=/app
      - MAOP_DATA_DIR=/app/data
      - MAOP_LOG_LEVEL=${MAOP_LOG_LEVEL:-INFO}
      # O-3 fix: emit JSON-structured logs by default for container
      # environments (ELK / Loki / CloudWatch parse JSON natively).
      # Override with MAOP_JSON_LOG=0 to restore plain-text logs.
      - MAOP_JSON_LOG=${MAOP_JSON_LOG:-1}
      - MAOP_DASH_HOST=0.0.0.0
      - MAOP_DASH_PORT=9079
      - MAOP_WORKERS=${MAOP_DASH_WORKERS:-1}
      - MAOP_RATE_LIMIT_ENABLED=1
      - MAOP_RATE_LIMIT_RPS=${MAOP_RATE_LIMIT_RPS:-30}
      - MAOP_RATE_LIMIT_BURST=${MAOP_RATE_LIMIT_BURST:-60}
      - MAOP_ENV=${MAOP_ENV:-production}
      - MAOP_AUTH=${MAOP_AUTH:-1}
      - MAOP_TLS=${MAOP_TLS:-0}
      - MAOP_TLS_CERT=${MAOP_TLS_CERT:-}
      - MAOP_TLS_KEY=${MAOP_TLS_KEY:-}
      # P2 安全修复: JWT 签名密钥。
      # - production (MAOP_ENV=production): 必须在 .env 中显式设置
      #   MAOP_JWT_SECRET，否则启动时 load_jwt_secret() 抛 RuntimeError 拒绝启动。
      # - 非生产环境: 留空时 auth.py 会用 secrets.token_hex(32) 自动生成
      #   64 字符随机密钥并持久化到 data/jwt_secret（mode 0o600），
      #   同时打印 SECURITY 警告日志。
      # - 弱密钥（"secret"/"changeme"/"password"/<32 字符）会被
      #   load_jwt_secret() 的强度校验拒绝。
      # 切勿在此硬编码真实密钥；请通过 .env 文件注入。
      - MAOP_JWT_SECRET=${MAOP_JWT_SECRET:-}
      - MAOP_LICENSE_KEY=${MAOP_LICENSE_KEY:-}
      - MAOP_CORS_ORIGINS=${MAOP_CORS_ORIGINS:-http://localhost:9079,http://127.0.0.1:9079}
      - MAOP_STORAGE_BACKEND=sqlite
      - MAOP_CACHE_BACKEND=local
      - MAOP_QUEUE_BACKEND=local
      - MAOP_KV_BACKEND=local
      - MAOP_SECRET_BACKEND=${MAOP_SECRET_BACKEND:-local}
      - MAOP_VAULT_ADDR=${MAOP_VAULT_ADDR:-http://vault:8200}
      # O-5 fix: no default token. When MAOP_SECRET_BACKEND=vault, operators
      # MUST set MAOP_VAULT_TOKEN explicitly. The previous default "dev-token"
      # is the well-known Vault dev-mode root token — unacceptable in prod.
      # Local dev: set MAOP_VAULT_TOKEN=dev-token in .env when using --profile vault.
      - MAOP_VAULT_TOKEN=${MAOP_VAULT_TOKEN:-}
      # t15: OTEL exporter wired into dashboard container so traces can reach
      # the otel-collector service via its service name (not localhost, which
      # would resolve to the dashboard container itself).
      - MAOP_OTEL_EXPORTER=${MAOP_OTEL_EXPORTER:-otlp}
      - MAOP_OTEL_ENDPOINT=${MAOP_OTEL_ENDPOINT:-http://otel-collector:4317}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9079/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Agent Executor Worker ───────────────────────────────────────
  agent-exec:
    build: *maop-build
    container_name: maop-agent-exec
    entrypoint: ["python", "-m", "maop.worker.agent_executor"]
    volumes:
      - maop-data:/app/data
      - maop-logs:/app/logs
      - ./config:/app/config:ro
    environment:
      - MAOP_ROOT=/app
      - MAOP_DATA_DIR=/app/data
      - MAOP_LOG_LEVEL=${MAOP_LOG_LEVEL:-INFO}
      # O-3 fix: JSON logs for container aggregation.
      - MAOP_JSON_LOG=${MAOP_JSON_LOG:-1}
      - MAOP_STORAGE_BACKEND=sqlite
      - MAOP_CACHE_BACKEND=local
      - MAOP_QUEUE_BACKEND=local
      - MAOP_KV_BACKEND=local
      - MAOP_SECRET_BACKEND=local
    depends_on:
      dashboard:
        condition: service_healthy
    # P3-D-06 fix: healthcheck via process existence (worker has no HTTP endpoint).
    # pgrep finds the python worker process; exits 0 if running, 1 if not.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'maop.worker.agent_executor' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Queue Worker (human approval, async tasks) ──────────────────
  queue-worker:
    build: *maop-build
    container_name: maop-queue-worker
    entrypoint: ["python", "-m", "maop.worker.queue_worker"]
    volumes:
      - maop-data:/app/data
      - maop-logs:/app/logs
      - ./config:/app/config:ro
    environment:
      - MAOP_ROOT=/app
      - MAOP_DATA_DIR=/app/data
      - MAOP_LOG_LEVEL=${MAOP_LOG_LEVEL:-INFO}
      # O-3 fix: JSON logs for container aggregation.
      - MAOP_JSON_LOG=${MAOP_JSON_LOG:-1}
      - MAOP_STORAGE_BACKEND=sqlite
      - MAOP_QUEUE_BACKEND=local
    depends_on:
      dashboard:
        condition: service_healthy
    # P3-D-06 fix: healthcheck via process existence (worker has no HTTP endpoint).
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'maop.worker.queue_worker' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Optional: OTel Collector ────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: maop-otel-collector
    profiles:
      - otel
      - monitoring  # P1 fix: prometheus(monitoring) depends_on 本服务，纳入 monitoring profile 避免单独 --profile monitoring 时依赖缺失
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      # P2-M-02 fix: 挂载 deploy/otel-collector.yaml（完整配置含 jaeger/prometheus/loki exporter、
      # tail_sampling、hostmetrics、resource processor），替代根目录简化版 otel-collector-config.yaml。
      - ./deploy/otel-collector.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC (T2-9: localhost only)
      - "127.0.0.1:4318:4318"   # OTLP HTTP (T2-9: localhost only)
      - "127.0.0.1:8889:8889"   # Prometheus metrics (T2-9: localhost only)
      - "127.0.0.1:13133:13133" # health_check extension (P2-D-01 fix)
    # t15: MAOP_OTEL_* env vars removed from otel-collector service — the
    # collector reads its own config file (--config=/etc/otel-collector-config.yaml)
    # and does not consume these. They now live on the dashboard service so
    # the app actually exports traces to the collector via its service name.
    # P2-D-01 fix: healthcheck via OTel Collector health_check extension (port 13133).
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:13133/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # P2-D-07 fix: bound otel-collector resources to prevent OOM-kill under burst load.
    # P3-D-04 fix: explicit log rotation (json-file 10m×3).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Optional: Nginx TLS termination ─────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: maop-nginx
    profiles:
      - tls
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      dashboard:
        condition: service_healthy
    # P2-D-02 fix: healthcheck via nginx serving HTTP.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # P2-D-08 fix: bound nginx resources (TLS termination layer).
    # P3-D-04 fix: explicit log rotation (json-file 10m×3).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Optional: Prometheus + AlertManager ─────────────────────────
  prometheus:
    # P3-D-03 fix: 统一 base 与 prod 的 Prometheus 版本为 v2.53.0，避免本地与生产行为差异。
    image: prom/prometheus:v2.53.0
    container_name: maop-prometheus
    profiles:
      - monitoring
    volumes:
      # O-1 fix: mount the actual prometheus.yml config (previously only
      # alert_rules.yml was mounted, but --config.file pointed at
      # /etc/prometheus/prometheus.yml which did not exist in the container
      # — Prometheus refused to start).
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Mount canonical alert rule files from monitoring/ so the paths in
      # prometheus.yml's `rule_files` block resolve inside the container.
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/slo-alerts.yml:/etc/prometheus/slo-alerts.yml:ro
      # P1 fix: also mount prometheus-alerts.yml — prometheus.yml's rule_files
      # now references it; without this mount Prometheus fails to load rules.
      - ./monitoring/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector
    # P2-D-03 fix: healthcheck via Prometheus /-/healthy endpoint.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # P2-D-09 fix: bound Prometheus resources (TSDB can grow large).
    # P3-D-04 fix: explicit log rotation (json-file 10m×3).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: maop-alertmanager
    profiles:
      - monitoring
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    # P2-D-04 fix: healthcheck via Alertmanager /-/healthy endpoint.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # P2-D-10 fix: bound Alertmanager resources.
    # P3-D-04 fix: explicit log rotation (json-file 10m×3).
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Optional: HashiCorp Vault (dev server, --profile vault) ──────
  # WARNING: This is a DEV-ONLY configuration. For production, use:
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
  vault:
    image: hashicorp/vault:1.17
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${MAOP_VAULT_TOKEN:-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"
    # P2-D-05 fix: healthcheck via `vault status` (exit 0 = initialized + unsealed;
    # in dev mode Vault auto-inits/unseals so this exits 0 once ready).
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # P3-D-05 fix: restart policy so the container auto-recovers on exit.
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
    security_opt:
      - no-new-privileges:true
    # P2-D-11 fix: bound Vault resources (secrets backend).
    # P3-D-04 fix: explicit log rotation (json-file 10m×3).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["vault"]

  # ── Optional: Redis (cache/queue/HA, --profile redis) ───────────
  redis:
    image: redis:7-alpine
    # O-5 fix (P0): no default password — same treatment as postgres above.
    # Operators MUST set MAOP_REDIS_PASSWORD in .env; compose fails fast via
    # the :? syntax instead of silently starting with the weak "maop_dev".
    command: redis-server --appendonly yes --requirepass ${MAOP_REDIS_PASSWORD:?Set MAOP_REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${MAOP_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles: ["redis"]

  # ── Optional: n8n workflow automation (Enterprise, --profile n8n) ──
  n8n:
    image: n8nio/n8n:1.45.0
    profiles: ["n8n"]
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=${MAOP_TIMEZONE:-Asia/Shanghai}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      # 3f335fb: hard-required (?:) interpolation broke the WHOLE compose
      # file even with the n8n profile disabled — docker compose validates
      # every service's variables during interpolation, so compose-smoke
      # failed before starting a single container. n8n is an optional
      # enterprise profile service: default the password (operator MUST
      # still set N8N_PASSWORD when actually enabling the profile — same
      # posture as PG/Redis fail-fast vars, which apply only to services
      # enabled in the default profile).
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-change-me-n8n-not-running}
      - N8N_API_KEY=${N8N_API_KEY:-}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - dashboard
    # P2-D-06 fix: healthcheck via n8n /healthz endpoint.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # P2-D-12 fix: bound n8n resources (workflow engine).
    # P3-D-04 fix: explicit log rotation (json-file 10m×3).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  maop-data:
    driver: local
  maop-logs:
    driver: local
  prometheus-data:
    driver: local
  pg-data:
    driver: local
  redis-data:
    driver: local
  n8n-data:
    driver: local
