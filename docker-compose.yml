# MAOP v4.0 — Cloud-Native Microservice Deployment
#
# Services:
#   dashboard     — FastAPI web UI + API gateway
#   agent-exec    — Agent execution worker (dispatches to LLM drivers)
#   queue-worker  — Background queue consumer (human approval, async tasks)
#   db            — Shared SQLite volume (single-writer via NFS/FUSE or sidecar)
#
# Quick start:  docker compose up -d
# With OTel:    docker compose --profile otel up -d
# With TLS:     docker compose --profile tls up -d
#
# Environment variables (see .env.example):
#   MAOP_DASH_PORT, MAOP_LOG_LEVEL, MAOP_AUTH_ENABLED, etc.
#
# t15 (2026-07-21): This is the single source of truth for MAOP docker
# compose. The previous duplicate at py/docker-compose.yml has been removed
# (its build context and volume paths were broken when launched from py/
# because ./config and ./nginx.conf are relative to the compose file).
# Always run `docker compose` from the repo root.

services:
  # ── PostgreSQL (optional, --profile postgres) ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maop
      POSTGRES_USER: maop
      POSTGRES_PASSWORD: maop_dev
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maop -d maop"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["postgres"]  # 可选 profile，默认不启动

  # ── Dashboard (API + Web UI) ────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: py/Dockerfile
    container_name: maop-dashboard
    ports:
      - "${MAOP_DASH_PORT:-9079}:9079"
    volumes:
      - maop-data:/app/data
      - maop-logs:/app/logs
      - ./config:/app/config:ro
    environment:
      - MAOP_ROOT=/app
      - MAOP_DATA_DIR=/app/data
      - MAOP_LOG_LEVEL=${MAOP_LOG_LEVEL:-INFO}
      - MAOP_DASH_HOST=0.0.0.0
      - MAOP_DASH_PORT=9079
      - MAOP_WORKERS=${MAOP_DASH_WORKERS:-1}
      - MAOP_RATE_LIMIT_ENABLED=1
      - MAOP_RATE_LIMIT_RPS=${MAOP_RATE_LIMIT_RPS:-30}
      - MAOP_RATE_LIMIT_BURST=${MAOP_RATE_LIMIT_BURST:-60}
      - MAOP_AUTH_ENABLED=${MAOP_AUTH_ENABLED:-0}
      - MAOP_TLS=0
      - MAOP_CORS_ORIGINS=${MAOP_CORS_ORIGINS:-http://localhost:9079}
      - MAOP_BACKEND_STORAGE=sqlite
      - MAOP_BACKEND_CACHE=local
      - MAOP_BACKEND_QUEUE=local
      - MAOP_BACKEND_KV=local
      - MAOP_BACKEND_SECRET=local
      # t3.3.4: Vault secret backend (opt-in via MAOP_SECRET_BACKEND=vault + --profile vault)
      - MAOP_SECRET_BACKEND=${MAOP_SECRET_BACKEND:-local}
      - MAOP_VAULT_ADDR=${MAOP_VAULT_ADDR:-http://vault:8200}
      - MAOP_VAULT_TOKEN=${MAOP_VAULT_TOKEN:-dev-token}
      # t15: OTEL exporter wired into dashboard container so traces can reach
      # the otel-collector service via its service name (not localhost, which
      # would resolve to the dashboard container itself).
      - MAOP_OTEL_EXPORTER=${MAOP_OTEL_EXPORTER:-otlp}
      - MAOP_OTEL_ENDPOINT=${MAOP_OTEL_ENDPOINT:-http://otel-collector:4317}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9079/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Agent Executor Worker ───────────────────────────────────────
  agent-exec:
    build:
      context: .
      dockerfile: py/Dockerfile
    container_name: maop-agent-exec
    entrypoint: ["python", "-m", "maop.worker.agent_executor"]
    volumes:
      - maop-data:/app/data
      - maop-logs:/app/logs
      - ./config:/app/config:ro
    environment:
      - MAOP_ROOT=/app
      - MAOP_DATA_DIR=/app/data
      - MAOP_LOG_LEVEL=${MAOP_LOG_LEVEL:-INFO}
      - MAOP_BACKEND_STORAGE=sqlite
      - MAOP_BACKEND_CACHE=local
      - MAOP_BACKEND_QUEUE=local
      - MAOP_BACKEND_KV=local
      - MAOP_BACKEND_SECRET=local
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Queue Worker (human approval, async tasks) ──────────────────
  queue-worker:
    build:
      context: .
      dockerfile: py/Dockerfile
    container_name: maop-queue-worker
    entrypoint: ["python", "-m", "maop.worker.queue_worker"]
    volumes:
      - maop-data:/app/data
      - maop-logs:/app/logs
      - ./config:/app/config:ro
    environment:
      - MAOP_ROOT=/app
      - MAOP_DATA_DIR=/app/data
      - MAOP_LOG_LEVEL=${MAOP_LOG_LEVEL:-INFO}
      - MAOP_BACKEND_STORAGE=sqlite
      - MAOP_BACKEND_QUEUE=local
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Optional: OTel Collector ────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: maop-otel-collector
    profiles:
      - otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics
    # t15: MAOP_OTEL_* env vars removed from otel-collector service — the
    # collector reads its own config file (--config=/etc/otel-collector-config.yaml)
    # and does not consume these. They now live on the dashboard service so
    # the app actually exports traces to the collector via its service name.
    restart: unless-stopped

  # ── Optional: Nginx TLS termination ─────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: maop-nginx
    profiles:
      - tls
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped

  # ── Optional: Prometheus + AlertManager ─────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: maop-prometheus
    profiles:
      - monitoring
    volumes:
      - ./prometheus-alerts.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: maop-alertmanager
    profiles:
      - monitoring
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  # ── Optional: HashiCorp Vault (dev server, --profile vault) ──────
  vault:
    image: hashicorp/vault:latest
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    profiles: ["vault"]

volumes:
  maop-data:
    driver: local
  maop-logs:
    driver: local
  prometheus-data:
    driver: local
  pg-data:
    driver: local
