apiVersion: v2
name: maop-operator
description: |
  PARTIALLY IMPLEMENTED (M-T3.3). This chart deploys the implemented kopf-based
  MAOP Kubernetes Operator for MaopAgent / MaopTask / MaopWorkflow custom
  resources (controller in py/maop/operator/; image buildable via ../Dockerfile).
  MaopTask reconcile is end-to-end kind-verified (2026-11-01, PR #203 chain).
  MaopAgent reconcile-into-workloads and MaopWorkflow remain planned; RLS /
  plugin loading still planned. `appVersion` names an image that is buildable
  locally but not yet published to a registry. See README.md §Status.
type: application
