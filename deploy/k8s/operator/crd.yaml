# MAOP Operator CRDs — combined multi-document manifest.
#
# This file is a concatenation of the individual CRDs under crds/. It is provided
# as a convenience for kubectl apply -f crd.yaml without Helm.
#
# CRDs included:
#   - MaopAgent    (crds/maopagent.yaml)
#   - MaopTask     (crds/maoptask.yaml)
#   - MaopWorkflow (crds/maopworkflow.yaml)
#
# Source of truth: the files under crds/. Regenerate with:
#   Get-ChildItem crds/*.yaml | ForEach-Object { Get-Content ; '---' } | Set-Content crd.yaml
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: maopagents.maop.io
  labels:
    app.kubernetes.io/name: maop-operator
    app.kubernetes.io/part-of: maop
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: maop.io
  names:
    kind: MaopAgent
    listKind: MaopAgentList
    plural: maopagents
    singular: maopagent
    shortNames:
      - maopa
      - maa
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: >
            MaopAgent declares the desired state of a MAOP agent workload.
            The operator reconciles this into a Deployment + Service + RLS
            policies scoped to the configured tenant.
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - model
              properties:
                model:
                  type: string
                  description: LLM model identifier (e.g. gpt-4o, claude-3.5-sonnet).
                systemPrompt:
                  type: string
                  description: System prompt injected into every conversation.
                tenant:
                  type: string
                  description: >
                    Tenant ID for multi-tenant isolation. The operator enforces
                    RLS scoping and per-tenant quotas against this value.
                replicas:
                  type: integer
                  minimum: 0
                  default: 1
                  description: Desired agent pod replicas.
                maxTurns:
                  type: integer
                  minimum: 1
                  default: 20
                  description: Maximum orchestration turns per task.
                tools:
                  type: array
                  description: MCP tool names this agent may invoke.
                  items:
                    type: string
                plugins:
                  type: array
                  description: Plugin names to load into this agent.
                  items:
                    type: string
                quotas:
                  type: object
                  description: Per-agent quota overrides (per-tenant defaults apply otherwise).
                  properties:
                    maxTokensPerDay:
                      type: integer
                      minimum: 0
                    maxRequestsPerDay:
                      type: integer
                      minimum: 0
                    maxConcurrentTasks:
                      type: integer
                      minimum: 0
                image:
                  type: string
                  description: Override the agent runtime image.
                env:
                  type: array
                  description: Additional environment variables.
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                      valueFrom:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              description: Observed state reported by the controller.
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                ready:
                  type: boolean
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Degraded
                    - Failed
                    - QuotaExceeded
                readyReplicas:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                lastReconcileTime:
                  type: string
                  format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.model
        - name: Tenant
          type: string
          jsonPath: .spec.tenant
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: maoptasks.maop.io
  labels:
    app.kubernetes.io/name: maop-operator
    app.kubernetes.io/part-of: maop
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: maop.io
  names:
    kind: MaopTask
    listKind: MaopTaskList
    plural: maoptasks
    singular: maoptask
    shortNames:
      - maopt
      - mt
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: >
            MaopTask represents a single orchestration task submitted to a MAOP
            agent. The operator creates a bounded execution (pod / job), enforces
            the tenant quota, and reports completion status.
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - agent
                - prompt
              properties:
                agent:
                  type: string
                  description: Name of the MaopAgent CR that should execute this task.
                prompt:
                  type: string
                  description: User prompt / instruction for the agent.
                tenant:
                  type: string
                  description: Tenant ID for RLS scoping and quota enforcement.
                maxTurns:
                  type: integer
                  minimum: 1
                  default: 20
                  description: Override the agent's default max turns for this task.
                tools:
                  type: array
                  description: Additional MCP tools enabled for this task only.
                  items:
                    type: string
                plugins:
                  type: array
                  description: Additional plugins loaded for this task only.
                  items:
                    type: string
                inputs:
                  type: object
                  description: Structured inputs passed to the agent.
                  x-kubernetes-preserve-unknown-fields: true
                timeoutSeconds:
                  type: integer
                  minimum: 0
                  default: 3600
                  description: Wall-clock timeout for the task execution.
                priority:
                  type: string
                  enum:
                    - low
                    - normal
                    - high
                    - urgent
                  default: normal
                retryPolicy:
                  type: object
                  properties:
                    maxRetries:
                      type: integer
                      minimum: 0
                      default: 0
                    backoffSeconds:
                      type: integer
                      minimum: 0
                      default: 30
            status:
              type: object
              description: Observed state reported by the controller.
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Succeeded
                    - Failed
                    - Cancelled
                    - TimedOut
                    - QuotaExceeded
                turns:
                  type: integer
                  description: Number of orchestration turns consumed.
                tokensUsed:
                  type: integer
                  description: Total tokens consumed by this task.
                result:
                  type: string
                  description: Final result / output of the task.
                error:
                  type: string
                  description: Error message if the task failed.
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Agent
          type: string
          jsonPath: .spec.agent
        - name: Tenant
          type: string
          jsonPath: .spec.tenant
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Turns
          type: integer
          jsonPath: .status.turns
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: maopworkflows.maop.io
  labels:
    app.kubernetes.io/name: maop-operator
    app.kubernetes.io/part-of: maop
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: maop.io
  names:
    kind: MaopWorkflow
    listKind: MaopWorkflowList
    plural: maopworkflows
    singular: maopworkflow
    shortNames:
      - maopw
      - mw
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: >
            MaopWorkflow defines a multi-step agent orchestration as a DAG of
            MaopTask nodes. The operator topologically sorts the steps, schedules
            each as a MaopTask, and aggregates overall workflow status.
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - steps
              properties:
                tenant:
                  type: string
                  description: Tenant ID for RLS scoping and quota enforcement.
                steps:
                  type: array
                  minItems: 1
                  description: Ordered list of workflow steps (DAG nodes).
                  items:
                    type: object
                    required:
                      - name
                      - agent
                      - prompt
                    properties:
                      name:
                        type: string
                        description: Unique step name within this workflow.
                      agent:
                        type: string
                        description: MaopAgent CR name to run this step.
                      prompt:
                        type: string
                        description: Prompt template; may reference outputs of upstream steps.
                      dependsOn:
                        type: array
                        description: Names of steps that must complete before this one.
                        items:
                          type: string
                      tools:
                        type: array
                        items:
                          type: string
                      plugins:
                        type: array
                        items:
                          type: string
                      maxTurns:
                        type: integer
                        minimum: 1
                      timeoutSeconds:
                        type: integer
                        minimum: 0
                      inputs:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                failureStrategy:
                  type: string
                  enum:
                    - failFast
                    - continue
                    - retry
                  default: failFast
                  description: How to handle a step failure.
                maxRetries:
                  type: integer
                  minimum: 0
                  default: 0
                  description: Global retry count per step (when failureStrategy=retry).
                timeoutSeconds:
                  type: integer
                  minimum: 0
                  default: 7200
                  description: Wall-clock timeout for the entire workflow.
            status:
              type: object
              description: Observed state reported by the controller.
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Succeeded
                    - Failed
                    - Cancelled
                    - TimedOut
                    - QuotaExceeded
                stepStatuses:
                  type: array
                  description: Per-step status snapshot.
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                      phase:
                        type: string
                        enum:
                          - Pending
                          - Running
                          - Succeeded
                          - Failed
                          - Skipped
                      taskName:
                        type: string
                        description: Name of the spawned MaopTask CR.
                      turns:
                        type: integer
                      tokensUsed:
                        type: integer
                      error:
                        type: string
                      startTime:
                        type: string
                        format: date-time
                      completionTime:
                        type: string
                        format: date-time
                totalTurns:
                  type: integer
                totalTokensUsed:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Tenant
          type: string
          jsonPath: .spec.tenant
        - name: Steps
          type: integer
          jsonPath: .spec.steps
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
