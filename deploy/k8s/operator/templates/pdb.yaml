{{/*
PodDisruptionBudget for MAOP Operator — planned: keep quorum during voluntary
disruptions. NOTE (PLANNED — NOT IMPLEMENTED): no operator pods exist today, so
this template has no effect yet. P1 reliability fix (2026-09-17).
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "maop-operator.fullname" . }}-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "maop-operator.labels" . | nindent 4 }}
spec:
  {{- if eq (int .Values.controller.replicas) 1 }}
  maxUnavailable: 0
  {{- else }}
  maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "maop-operator.selectorLabels" . | nindent 6 }}
