{{/*
PodDisruptionBudget for MAOP Operator — keep quorum during voluntary
disruptions. The operator controller/image exist (py/maop/operator + ../Dockerfile;
kind-verified 2026-11-01, PR #203 chain), so this template takes effect when the
chart is installed. P1 reliability fix (2026-09-17).
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "maop-operator.fullname" . }}-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "maop-operator.labels" . | nindent 4 }}
spec:
  {{- if eq (int .Values.controller.replicas) 1 }}
  maxUnavailable: 0
  {{- else }}
  maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "maop-operator.selectorLabels" . | nindent 6 }}
