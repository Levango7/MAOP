{{- if .Values.rbac.create }}
{{- if .Values.rbac.clusterScope }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "maop-operator.fullname" . }}
  labels:
    {{- include "maop-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "events", "namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["maop.io"]
    resources: ["maopagents", "maopagents/status", "maopagents/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # M0 缺口（kind 烟测 2026-11-01 逮到）：operator 实际监听的是 maoptasks，
  # 但 RBAC 只登记了 maopagents —— kopf list/watch 直接 Forbidden。
  - apiGroups: ["maop.io"]
    resources: ["maoptasks", "maoptasks/status", "maoptasks/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "maop-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "maop-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["maop.io"]
    resources: ["maopagents", "maopagents/status", "maopagents/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # M0 缺口（kind 烟测 2026-11-01 逮到）：同 ClusterRole 侧注释。
  - apiGroups: ["maop.io"]
    resources: ["maoptasks", "maoptasks/status", "maoptasks/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
{{- end }}
{{- end }}
