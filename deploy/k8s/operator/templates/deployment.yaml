{{/*
Controller Deployment running the implemented operator (py/maop/operator;
image built via ../Dockerfile). Probe contract: the operator process serves
GET /healthz on the metrics port via kopf's built-in liveness server
(py/maop/operator/__main__.py) — kopf serves a single endpoint, so readiness
shares the /healthz path. Validated against kind (kindest/node v1.35) smoke
2026-11-01. The other PLANNED banners in this directory (crd.yaml, README,
networkpolicy) are separately outdated and tracked as docs debt.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "maop-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "maop-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "maop-operator.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "maop-operator.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
    spec:
      serviceAccountName: {{ include "maop-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      containers:
        - name: manager
          # NOT BUILT: no Dockerfile / build workflow for this image exists in the repo.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect
            - --max-concurrent-reconciles={{ .Values.controller.maxConcurrentReconciles }}
            - --log-level={{ .Values.controller.logLevel }}
            {{- if .Values.controller.watchNamespaces }}
            - --watch-namespaces={{ include "maop-operator.watchNamespaces" . }}
            {{- end }}
            {{- if .Values.controller.multiTenant.enabled }}
            - --multi-tenant=true
            - --default-max-tokens={{ .Values.controller.multiTenant.defaultQuotas.maxTokensPerDay }}
            - --default-max-requests={{ .Values.controller.multiTenant.defaultQuotas.maxRequestsPerDay }}
            - --default-max-agents={{ .Values.controller.multiTenant.defaultQuotas.maxAgents }}
            - --default-max-concurrent={{ .Values.controller.multiTenant.defaultQuotas.maxConcurrentTasks }}
            {{- end }}
            {{- if .Values.controller.plugins.enabled }}
            - --plugins-enabled=true
            - --plugins-strict-api={{ .Values.controller.plugins.strictApi }}
            {{- end }}
          env:
            # 子进程 `maop run` 的运行时根目录（熔断器/使用记录等写这里）。
            # 非容器化本机跑 MAOP 用默认家目录；集群里必须落到下面
            # runtime-data 可写卷上（kind 烟测 2026-11-01 逮到）。
            - name: MAOP_ROOT_DIR
              value: /data
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MAOP_LOG_LEVEL
              value: {{ .Values.controller.logLevel | quote }}
          ports:
            - name: webhook-server
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          volumeMounts:
            # 运行时可写卷：容器根文件系统对非 root 用户不可写，缺它子进程
            # 直接 Permission denied（kind 烟测 2026-11-01 逮到）。
            # emptyDir = 临时运行态（Pod 重建即失）；生产持久化属后续 values 化。
            - name: runtime-data
              mountPath: /data
          {{- if .Values.webhook.enabled }}
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              # kopf 内置健康服务单端点，readiness 与 liveness 共用 /healthz。
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        # 运行时可写卷（对应上方 MAOP_ROOT_DIR=/data 的 mount）。
        - name: runtime-data
          emptyDir: {}
        {{- if .Values.webhook.enabled }}
        - name: webhook-certs
          secret:
            defaultMode: 420
            secretName: {{ include "maop-operator.fullname" . }}-webhook-tls
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
