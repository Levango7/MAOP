apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "maop-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "maop-operator.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "maop-operator.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "maop-operator.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
    spec:
      serviceAccountName: {{ include "maop-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect
            - --max-concurrent-reconciles={{ .Values.controller.maxConcurrentReconciles }}
            - --log-level={{ .Values.controller.logLevel }}
            {{- if .Values.controller.watchNamespaces }}
            - --watch-namespaces={{ include "maop-operator.watchNamespaces" . }}
            {{- end }}
            {{- if .Values.controller.multiTenant.enabled }}
            - --multi-tenant=true
            - --default-max-tokens={{ .Values.controller.multiTenant.defaultQuotas.maxTokensPerDay }}
            - --default-max-requests={{ .Values.controller.multiTenant.defaultQuotas.maxRequestsPerDay }}
            - --default-max-agents={{ .Values.controller.multiTenant.defaultQuotas.maxAgents }}
            - --default-max-concurrent={{ .Values.controller.multiTenant.defaultQuotas.maxConcurrentTasks }}
            {{- end }}
            {{- if .Values.controller.plugins.enabled }}
            - --plugins-enabled=true
            - --plugins-strict-api={{ .Values.controller.plugins.strictApi }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MAOP_LOG_LEVEL
              value: {{ .Values.controller.logLevel | quote }}
          ports:
            - name: webhook-server
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: webhook-certs
          secret:
            defaultMode: 420
            secretName: {{ include "maop-operator.fullname" . }}-webhook-tls
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
