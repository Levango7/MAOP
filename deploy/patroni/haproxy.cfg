# ─────────────────────────────────────────────────────────────────────
# HAProxy 配置 — MAOP Patroni 集群读写分离
#
# - 端口 5432：写流量（仅 primary）
# - 端口 5433：读流量（primary + 全部 replica）
# - 端口 8008：Patroni REST API（健康检查）
# - 端口 7000：HAProxy 统计面板
#
# Patroni 通过 REST API /read-write 与 /read-only 端点动态标记角色，
# HAProxy 据此路由，无需手动切换。
# ─────────────────────────────────────────────────────────────────────

global
    log stdout format raw local0
    maxconn 2000
    stats socket /run/haproxy/admin.sock mode 660 level admin
    # 安全加固
    chroot /run/haproxy
    user haproxy
    group haproxy
    # 性能调优
    tune.bufsize 32768
    tune.ssl.default-dh-param 2048
    ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    option logasymmetric
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout tunnel 1h
    # 重试策略：连接失败重试 3 次，间隔 1s
    retries 3
    timeout retry 1s

# ── 统计面板 ─────────────────────────────────────────────────────
listen stats
    bind *:7000
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /
    stats refresh 10s
    stats show-legends
    stats admin if TRUE

# ── Patroni REST API 健检查（前端）──────────────────────────────
frontend patroni_api
    bind *:8008
    default_backend patroni_api_nodes

backend patroni_api_nodes
    option httpchk GET /health
    http-check expect status 200
    server patroni1 patroni1:8008 check
    server patroni2 patroni2:8008 check
    server patroni3 patroni3:8008 check

# ── 写流量（仅 primary）────────────────────────────────────────
# Patroni /read-write 端点仅在 primary 上返回 200
frontend pg_write
    bind *:5432
    default_backend pg_primary

backend pg_primary
    option httpchk GET /read-write
    http-check expect status 200
    tcp-check connect
    server patroni1 patroni1:5432 check port 8008 inter 3s rise 2 fall 3
    server patroni2 patroni2:5432 check port 8008 inter 3s rise 2 fall 3
    server patroni3 patroni3:5432 check port 8008 inter 3s rise 2 fall 3

# ── 读流量（primary + replica，轮询）──────────────────────────
# Patroni /read-only 端点在 primary 与 replica 上均返回 200
frontend pg_read
    bind *:5433
    default_backend pg_readreplicas

backend pg_readreplicas
    balance roundrobin
    option httpchk GET /read-only
    http-check expect status 200
    tcp-check connect
    server patroni1 patroni1:5432 check port 8008 inter 3s rise 2 fall 3 weight 1
    server patroni2 patroni2:5432 check port 8008 inter 3s rise 2 fall 3 weight 2
    server patroni3 patroni3:5432 check port 8008 inter 3s rise 2 fall 3 weight 2
    # replica 权重更高（2），primary 权重低（1），读流量优先打 replica

# ── 同步 replica（用于同步复制监控）────────────────────────────
frontend pg_sync_replica
    bind *:5434
    default_backend pg_sync_replica_nodes

backend pg_sync_replica_nodes
    option httpchk GET /sync
    http-check expect status 200
    tcp-check connect
    server patroni1 patroni1:5432 check port 8008 inter 3s rise 2 fall 3
    server patroni2 patroni2:5432 check port 8008 inter 3s rise 2 fall 3
    server patroni3 patroni3:5432 check port 8008 inter 3s rise 2 fall 3