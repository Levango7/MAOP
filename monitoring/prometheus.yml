# MAOP Prometheus Configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # MAOP Dashboard metrics
  - job_name: "maop"
    metrics_path: /api/prometheus
    static_configs:
      - targets: ["maop:9079"]
        labels:
          service: "maop-dashboard"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

rule_files:
  - /etc/prometheus/alerts.yml