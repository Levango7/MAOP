# MAOP Prometheus Alert Rules
# Metrics source: maop.core.monitoring (MetricsCollector)
#
# P2-4 fix (2026-08-23): audit confirmed all metrics below are BOTH defined
# in maop.core.monitoring.monitoring AND emitted by production code:
#   - MAOP_delegations_total:    dispatch_core.py:353, maop_plan.py:280 (.inc())
#   - MAOP_delegations_success:  dispatch_core.py:711 (.inc())
#   - MAOP_delegations_failed:   dispatch_core.py:721 (.inc())
#   - MAOP_active_agents:        agent_registry.py:243 (.set())
#   - MAOP_memory_entries:       episodic_store.py:174 (.set())
#   - MAOP_queue_pending:        message_queue.py:596 (.set())
#   - MAOP_circuit_breaker_state: circuit_breaker.py:317 (.set())
# Previous comment claiming "defined but not yet emitted" was stale — the
# metrics ARE emitted, so these alerts WILL fire when thresholds are breached.
#
# This file is loaded by monitoring/prometheus.yml (rule_files). It is
# complementary to alerts.yml / slo-alerts.yml; alert *names* here are
# distinct (Agent*, No*, Queue*, Memory*) so there is no collision.

groups:
  - name: maop-agent
    rules:
      - alert: AgentHighFailureRate
        # P2-4 fix: use clamp_min to avoid division-by-zero when
        # MAOP_delegations_total is 0 (no delegations yet). Without this,
        # the expr evaluates to NaN and the alert never fires even when
        # failures occur. Threshold lowered from 0.5 to 0.3 for earlier
        # warning (30% failure rate is already actionable).
        expr: |
          (
            sum(rate(MAOP_delegations_failed[5m]))
            /
            clamp_min(sum(rate(MAOP_delegations_total[5m])), 1e-9)
          ) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent failure rate exceeds 30%"
          description: "More than 30% of delegations are failing (current: {{ $value | humanizePercentage }})."

      - alert: AgentCircuitBreakerOpen
        # MAOP_circuit_breaker_state is registered WITHOUT labels, so there is
        # no per-agent `agent` label — do not reference $labels.agent here.
        # Metric emitted by circuit_breaker.py:317 (.set()) on state transitions.
        expr: MAOP_circuit_breaker_state == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker is OPEN"
          description: "An agent circuit breaker is OPEN and not accepting requests."

  - name: maop-system
    rules:
      - alert: QueueBacklogGrowing
        # MAOP_queue_pending emitted by message_queue.py:596 (.set(pending)).
        expr: |
          MAOP_queue_pending > 100
          and
          deriv(MAOP_queue_pending[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Queue backlog is growing ({{ $value }} pending)"
          description: "Pending messages keep increasing, workers may be overwhelmed."

      - alert: NoActiveAgents
        # MAOP_active_agents emitted by agent_registry.py:243 (.set(count)).
        expr: MAOP_active_agents == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No active agents available"
          description: "All agents are either disabled or circuit-broken."

      - alert: MemoryStoreGrowing
        # MAOP_memory_entries emitted by episodic_store.py:174 (.set(count)).
        expr: |
          MAOP_memory_entries > 100000
          and
          deriv(MAOP_memory_entries[1h]) > 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Memory store exceeds 100K entries and growing"
          description: "Consider running memory prune to reduce store size."
