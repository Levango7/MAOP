# MAOP Prometheus Alert Rules
# Metrics source: maop.core.monitoring (MetricsCollector)
#
# NOTE: every metric below is DEFINED in maop.core.monitoring.monitoring
# (e.g. MAOP_delegations_total, MAOP_active_agents, MAOP_queue_pending,
# MAOP_circuit_breaker_state, MAOP_memory_entries). The metric *names* are
# valid, so these rules evaluate correctly once the counters/gauges start
# being incremented by the runtime. Until then they stay at 0 and the
# alerts simply will not fire — that is expected (see audit: core MAOP_*
# metrics are defined but not yet emitted by production code).
#
# This file is loaded by monitoring/prometheus.yml (rule_files). It is
# complementary to alerts.yml / slo-alerts.yml; alert *names* here are
# distinct (Agent*, No*, Queue*, Memory*) so there is no collision.

groups:
  - name: maop-agent
    rules:
      - alert: AgentHighFailureRate
        expr: |
          (
            rate(MAOP_delegations_failed[5m])
            / rate(MAOP_delegations_total[5m])
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent failure rate exceeds 50%"
          description: "More than half of delegations are failing (current: {{ $value | humanizePercentage }})."

      - alert: AgentCircuitBreakerOpen
        # MAOP_circuit_breaker_state is registered WITHOUT labels, so there is
        # no per-agent `agent` label — do not reference $labels.agent here.
        expr: MAOP_circuit_breaker_state == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker is OPEN"
          description: "An agent circuit breaker is OPEN and not accepting requests."

  - name: maop-system
    rules:
      - alert: QueueBacklogGrowing
        expr: |
          MAOP_queue_pending > 100
          and
          deriv(MAOP_queue_pending[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Queue backlog is growing ({{ $value }} pending)"
          description: "Pending messages keep increasing, workers may be overwhelmed."

      - alert: NoActiveAgents
        expr: MAOP_active_agents == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No active agents available"
          description: "All agents are either disabled or circuit-broken."

      - alert: MemoryStoreGrowing
        expr: |
          MAOP_memory_entries > 100000
          and
          deriv(MAOP_memory_entries[1h]) > 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Memory store exceeds 100K entries and growing"
          description: "Consider running memory prune to reduce store size."
