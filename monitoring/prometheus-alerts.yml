# MAOP Prometheus Alert Rules
# Metrics source: maop.core.monitoring (MetricsCollector)
#
# NOTE: every metric below is DEFINED in maop.core.monitoring.monitoring
# (e.g. MAOP_delegations_total, MAOP_active_agents, MAOP_queue_pending,
# MAOP_circuit_breaker_state, MAOP_memory_entries). The metric *names* are
# valid, so these rules evaluate correctly once the counters/gauges start
# being incremented by the runtime.
# Metrics are emitted by dispatch_core.py, maop_plan.py, agent_registry.py
# (P2 修复：旧注释称 "metrics not yet emitted" 已过时 —— 上述模块已在
# 生产代码中 inc()/set() 这些计数器，告警规则可正常触发).
#
# This file is loaded by monitoring/prometheus.yml (rule_files). It is
# complementary to alerts.yml / slo-alerts.yml.
#
# P3-M-01 fix: removed 4 duplicate alert rules that were semantically
# identical to alerts.yml (same expr, different alert name):
#   - AgentCircuitBreakerOpen  ≡ MAOPCircuitBreakerOpen
#   - QueueBacklogGrowing       ≡ MAOPQueueBacklogGrowing
#   - NoActiveAgents            ≡ MAOPNoActiveAgents
#   - MemoryStoreGrowing        ≡ MAOPMemoryStoreGrowing
# Keeping both caused the same condition to fire two alerts (noise).
# Only AgentHighFailureRate remains here (no equivalent in alerts.yml).

groups:
  - name: maop-agent
    rules:
      - alert: AgentHighFailureRate
        expr: |
          (
            rate(MAOP_delegations_failed[5m])
            / rate(MAOP_delegations_total[5m])
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent failure rate exceeds 50%"
          description: "More than half of delegations are failing (current: {{ $value | humanizePercentage }})."
