apiVersion: 1
providers:
  - name: maop
    orgId: 1
    folder: MAOP
    type: file
    disableDeletion: false
    allowUi: true
    editable: true
    options:
      # Dashboards are mounted from monitoring/grafana (see docker-compose.prod.yml
      # grafana service: ./monitoring/grafana -> /etc/grafana/dashboards).
      path: /etc/grafana/dashboards
      # P3-M-02 fix: maop-slo.json (empty placeholder) was deleted. Only load
      # the populated overview dashboard. To add the SLO dashboard back,
      # implement it based on slo-alerts.yml (SLO-1~5 metrics) and add the
      # filename to this include list.
      include: ["maop-overview.json"]
