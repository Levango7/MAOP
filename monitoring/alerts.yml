# MAOP Alert Rules

groups:
  - name: maop-alerts
    rules:
      - alert: MAOPDown
        expr: up{job="maop"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MAOP Dashboard is down"
          description: "MAOP has been down for more than 1 minute."

      - alert: MAOPHighMemory
        expr: process_resident_memory_bytes{job="maop"} > 1000000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MAOP memory usage > 1GB"
          description: "MAOP resident memory has exceeded 1GB for 5 minutes."

      - alert: MAOPHighLatency
        expr: histogram_quantile(0.95, rate(MAOP_loop_duration_ms_bucket[5m])) > 2000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MAOP loop P95 latency > 2s"
          description: "Loop duration P95 is {{ $value }}ms"

      - alert: MAOPLowSuccessRate
        expr: rate(MAOP_tasks_success_total[5m]) / rate(MAOP_tasks_total[5m]) < 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "MAOP task success rate < 80%"
          description: "Task success rate is below 80% for the last 10 minutes."