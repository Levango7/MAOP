# ─────────────────────────────────────────────────────────────────────
# MAOP — Unified CI/CD Pipeline (GitHub Actions)
#
# Pipeline: lint → unit tests (matrix) → frontend build → Docker build → publish → deploy → (rollback on failure)
# ─────────────────────────────────────────────────────────────────────

name: MAOP CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'py/**'
      - 'config/**'
      - 'dashboard/**'
      - 'dashboard-enterprise/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'py/**'
      - 'config/**'
      - 'dashboard/**'
      - 'dashboard-enterprise/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      rollback:
        description: 'Rollback to previous deployment (skip build/test/deploy)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# ── Concurrency control ───────────────────────────────────────────
# P2-4 fix: 同一分支同一 workflow 仅保留最新一次运行，自动取消中间运行。
# PR 使用 pull_request_number 作为 group key（避免 main 分支并发被误取消）；
# 主分支使用 ref，确保 push 到 main/master/develop 时旧运行被取消。
# rollback workflow_dispatch 不受并发限制（group=rollback-${{ github.run_id }}）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── Minimal permissions (least privilege) ────────────────────────
# P2-4 fix: 顶层默认只读权限。需要写权限的 job（deploy/rollback/publish）
# 在 job 级别显式提权，避免所有 job 默认获得 contents:write 等危险权限。
# 参考：https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions:
  contents: read
  packages: read
  checks: write        # test job 上传 junit 结果需要
  pull-requests: write # PR 评论/状态需要

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

jobs:
  # ── Lint ────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff==0.16.3" "mypy==2.3.1"
      - run: ruff check maop/ tests/
      # 显式 --no-warn-unused-ignores：不依赖 pyproject [tool.mypy] 读取
      # （CI 依赖缺失环境下 type:ignore 大量 unused，pyproject 配置若未
      # 生效会误报红）。真实类型错误仍正常拦截。
      - name: mypy (diagnostic)
        run: |
          set +e
          mypy maop/ --ignore-missing-imports --no-warn-unused-ignores 2>&1 | tee /tmp/mypy-ci.log
          status=${PIPESTATUS[0]}
          {
            echo "### mypy output (exit=$status)"
            echo '```'
            tail -80 /tmp/mypy-ci.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Config drift audit
        run: python scripts/check_config_drift.py

      - name: Doc↔Code reconcile
        run: python scripts/doc_reconcile.py

  # ── Test ────────────────────────────────────────────────────────
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: lint
    defaults:
      run:
        working-directory: py
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 与 pyproject.toml 的 requires-python = ">=3.10" 保持一致
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: py/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 不装 requirements.lock 全量（参考文件，含可选后端驱动）。
          # editable 自动装 [project].dependencies（base）；test 依赖显式装。
          # fakeredis/lxml 为测试硬依赖（distributed_execution/enterprise_integration
          # 集合需要），原 requirements.lock 隐式提供，改 editable 后必须显式补。
          # P2-4: 测试依赖统一由 pyproject.toml [dev] extra 声明（单一真相源），
          # 避免在此手工罗列导致与 pyproject.toml 漂移。editable 安装同时拉取 base deps。
          pip install -e .[dev]

      - name: Enterprise extra smoke (P0-2)
        # 审计 P0-2：`pip install maop[enterprise]` 必须可装（此前 etcd3 在
        # enterprise extra 内、Python≥3.13 装不上 → 付费用户第一步就撞墙）。
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: pip install -e .[enterprise] && python -c "import maop; print('enterprise extra install OK')"

      - name: Detect enterprise package
        # H4 修复：显式检测 py/maop/enterprise/ 是否存在，输出明确告警。
        # 替代原 --ignore 列表静默跳过的方式，让 CI 日志清晰可见。
        shell: bash
        run: |
          if [ -d maop/enterprise ] && python -c "import maop.enterprise" 2>/dev/null; then
            echo "ENTERPRISE_AVAILABLE=true" >> "$GITHUB_ENV"
            echo "::notice::maop.enterprise 包存在，将运行企业版测试"
          else
            echo "ENTERPRISE_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "::warning::maop.enterprise 包不存在，跳过企业版测试（已通过 pytest.skip 显式标注）"
          fi

      - name: Run unit tests
        # ADR-017: 企业代码已移至私有仓库 MAOS，企业测试条件化运行
        # 个人版 CI 不运行企业测试（maop.enterprise 不可导入）
        # P0 fix (2026-08-11): 移除 --cov-fail-under(让 pytest 仅对测试成败负责),
        # 覆盖率门禁交给下一步的 ratchet 脚本,这样测试失败仍然会让 CI 失败,
        # 覆盖率回归也会让 CI 失败,两者职责清晰。
        # H4 修复：移除原 --ignore 列表（22 个文件静默跳过），改为依赖测试文件
        # 内的 pytest.skip(reason="maop.enterprise 未发布") 显式跳过。这样测试
        # 报告中会显式统计跳过数，而非通过 --ignore 静默排除。
        # --timeout=60: 防挂起测试无限等待(历史: pg_persist 池重试/PowerShell
        # 冷启动曾让 windows job 卡 25-30 分钟)。任何单测挂起 60s 即失败,
        # 错误定位到具体测试而非整个 job 卡死。
        # --reruns=3 --reruns-delay=2: auto-retry flaky tests up to 3 times
        # with 2s delay. Evidence: CI #136 all-green, #137 (lint-only change)
        # Ubuntu 3.10 failed, #138 Win 3.11 failed — classic flaky pattern
        # where failures randomly appear on different platforms across runs.
        # --junitxml: export results for artifact upload (debugging future flakes).
        shell: bash
        run: |
          python -m pytest tests/ -q --ignore=tests/contract \
            -m "not slow" --cov=maop --cov-report=xml --cov-report=term-missing \
            --timeout=60 --reruns=3 --reruns-delay=2 --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: py/test-results.xml
          retention-days: 7

      - name: Coverage ratchet gate (核心包门禁)
        # H3 修复：移除 `if python -c "import maop.enterprise"` 条件（该条件
        # 永远为假，导致覆盖率门禁从未执行）。改为无条件执行核心包门禁，
        # 企业包门禁单独拆分为可选步骤（仅当 enterprise 存在时执行）。
        # 核心包门禁始终执行，确保覆盖率回退被 CI 阻断。
        shell: bash
        run: |
          python scripts/check_coverage_ratchet.py

      - name: Coverage ratchet gate (企业包门禁，可选)
        # H3 修复：企业包门禁仅当 maop.enterprise 可导入时执行。
        # 个人版 CI 自动跳过，不影响核心包门禁。
        shell: bash
        run: |
          if python -c "import maop.enterprise" 2>/dev/null; then
            python scripts/check_coverage_ratchet.py --include="maop/enterprise/*" --fail-under=70
          else
            echo "::notice::maop.enterprise 未发布，跳过企业包覆盖率门禁"
          fi

      - name: Run edition tests
        run: python -m pytest tests/test_edition.py -v --no-cov

      - name: Run contract tests
        run: python -m pytest tests/contract/ -q -m contract --no-cov

      - name: Run e2e tests
        # 不能用 `-p no:xdist`：pyproject addopts 有 `-n auto`（xdist 并行），
        # 禁用 xdist 插件后 `-n auto` 变 unrecognized → exit 4（CI 12 平台
        # pytest job 全挂的真凶之一）。`-n 0` 显式覆盖为单进程，xdist 保持启用。
        # H5 修复：原 `|| true` 掩盖所有退出码，导致非 exit 5 失败（如 import
        # 错误、配置错误）被静默忽略。现改为精确过滤 exit 5（No tests ran），
        # 仅容忍 exit 5（e2e 在主矩阵 auth=0 时全 skip 是预期噪音），
        # 其他非零退出码（exit 1/2/4 等）仍判失败。
        # 若需要真跑 e2e：`MAOP_AUTH=1 MAOP_ADMIN_PASSWORD=... pytest tests/e2e/`。
        run: |
          set +e
          python -m pytest tests/e2e/ -q --timeout=15 -p no:cacheprovider --no-cov -n 0
          code=$?
          set -e
          if [ $code -ne 0 ] && [ $code -ne 5 ]; then
            echo "::error::e2e 测试失败（exit code=$code），仅 exit 5（No tests ran）被容忍"
            exit $code
          fi
          if [ $code -eq 5 ]; then
            echo "::warning::e2e 测试无用例执行（exit 5），主矩阵 auth=0 下属预期行为"
          fi

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: py/coverage.xml
          fail_ci_if_error: false

  # ── Performance & Reliability (slow) ────────────────────────────
  # P2 fix (2026-08-14): 性能/可靠性/稳定性测试此前被 test job 的 `-m "not slow"`
  # 排除，从不被 CI 触发。独立 job 跑这些慢测试，不阻塞主矩阵、可单独重跑。
  performance:
    name: Performance & Reliability (slow)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: py/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 同 test job：不装 requirements.lock 全量（etcd3/torch 无法在新 Python 安装）。
          # pytest-xdist + pytest-cov 必须装：pyproject addopts 有 -n auto --cov。
          pip install -e .
          pip install pytest pytest-asyncio pytest-timeout pytest-xdist pytest-cov

      - name: Run performance smoke tests
        run: python -m pytest tests/performance/ -q -m slow --timeout=120

      - name: Run reliability & stability tests
        run: python -m pytest tests/reliability/ tests/stability/ -q --timeout=120

  # ── Frontend Build ──────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard-enterprise/package-lock.json

      - name: Install dependencies
        working-directory: dashboard-enterprise
        run: npm ci

      - name: Lint frontend
        run: npm run lint
        working-directory: dashboard-enterprise

      - name: Run frontend tests
        run: npm test
        working-directory: dashboard-enterprise

      - name: Build enterprise dashboard
        working-directory: dashboard-enterprise
        run: npx vite build

      - name: Upload enterprise dist
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-enterprise-dist
          path: dashboard/dist-enterprise/

  # ── Playwright E2E Tests ───────────────────────────────────────
  # G-16: Real browser E2E tests via Playwright.
  # Runs against the Vite dev server (webServer config in playwright.config.js).
  # Browser binaries are cached via the playwright cache dependency path.
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend
    defaults:
      run:
        working-directory: dashboard-enterprise
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard-enterprise/package-lock.json

      - name: Install dependencies
        run: npm ci

      # P2 fix (2026-08-14): 起后端依赖 Python 环境，供 playwright webServer
      # 启动 ../py/start_dashboard.py（真实前后端联调 smoke）。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: py/requirements.lock

      - name: Install backend dependencies (E2E backend server)
        run: |
          python -m pip install --upgrade pip
          # 只装 base 依赖（editable install 自动安装 [project].dependencies）。
          # 不装 requirements.lock 全量：其含 enterprise 驱动（etcd3 2019 停更+CVE，
          # 新 Python 无法安装）与 ML 依赖（sentence-transformers→torch），
          # E2E 起后端用不到且会导致 pip 失败。
          pip install -e ../py/
          pip install uvicorn

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=github,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: dashboard-enterprise/playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-traces
          path: dashboard-enterprise/test-results/
          retention-days: 7

  # ── Migration Tests ─────────────────────────────────────────────
  migrations:
    name: Alembic migrations (upgrade/downgrade)
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      MAOP_DATA_DIR: /tmp/maop-migration-test
      # env.py 通过 MAOP_DB_URL 覆盖默认 sqlite 路径，使用临时库避免污染源码树
      MAOP_DB_URL: sqlite:////tmp/maop-migration-test/maop.db
      # 002_schema_sync 的 downgrade 有破坏性守卫（防 jwt_revoked 等表被删）；
      # 测试库是 /tmp 临时 sqlite，放行降级以验证 upgrade→downgrade→upgrade 链。
      MAOP_ALLOW_DESTRUCTIVE_DOWNGRADE: "1"
    services:
      # G5: PostgreSQL service container for PG integration smoke tests.
      # 健康检查确保 CI 步骤执行前 PG 已就绪，避免连接被拒。
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: maop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 不用 requirements.txt（含 etcd3>=0.12.0，2019 停更+CVE，新 Python 装不上）。
          # editable 安装自动解析 pyproject [project.dependencies]。
          pip install -e py/
          pip install alembic

      - name: Test upgrade then downgrade then upgrade
        run: |
          mkdir -p $MAOP_DATA_DIR
          # alembic.ini 位于项目根目录，script_location 为相对路径，
          # 必须在根目录运行 alembic（不能 cd 到 py/）
          # 升级到 head
          alembic upgrade head
          # 降级到 base
          alembic downgrade base
          # 再次升级到 head 验证幂等性
          alembic upgrade head

      - name: Test with PostgreSQL
        working-directory: py
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/maop_test
        run: |
          pip install pytest pytest-asyncio pytest-timeout pytest-xdist pytest-cov psycopg2-binary
          python -m pytest tests/test_backends_pg_integration.py -v -m integration

  # ── Docker Build ────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, frontend, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Download enterprise dist
        uses: actions/download-artifact@v4
        with:
          name: dashboard-enterprise-dist
          path: dashboard/dist-enterprise/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # if: 表达式不能直接引用 secrets context（Unrecognized named-value:
      # 'secrets'，5e3174b 因此 workflow 解析失败）。先用 env 注入 secrets，
      # 探测步骤输出 configured=true/false，后续 if/push 只引用 steps context。
      - name: Check registry configured
        id: reg
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
        run: |
          if [ -n "$REGISTRY_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to Container Registry
        # 仅当仓库配置了 registry secrets 才登录；未配置（如公开仓库/无
        # 发布计划）时跳过登录且只构建不推送，避免 "Username and password
        # required" 失败（9c01b38 首次真正执行 docker job 时暴露）。
        if: github.event_name != 'pull_request' && steps.reg.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL || '' }}
          username: ${{ secrets.REGISTRY_USER || '' }}
          password: ${{ secrets.REGISTRY_PASS || '' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: py/Dockerfile
          push: ${{ github.event_name != 'pull_request' && steps.reg.outputs.configured == 'true' }}
          tags: |
            ${{ secrets.REGISTRY_URL || 'maop' }}/maop:latest
            ${{ secrets.REGISTRY_URL || 'maop' }}/maop:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security Scan ───────────────────────────────────────────────
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      # P0-2 fix: 审真实运行环境的 requirements.lock（此前审 requirements.txt，
      # 与 editable 安装的实际依赖不一致，且含已移除的 etcd3）。
      - run: pip-audit -r requirements.lock

  # ── SAST (bandit) ──────────────────────────────────────────────
  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit
      # 3.7 fix: 报告生成也使用 .bandit 配置，确保报告与门禁规则一致。
      - run: bandit -r maop/ -c .bandit -f json -o bandit-report.json || true
      # 3.7 fix: 恢复 -ll（Low 及以上），不再用 -lll 忽略 Medium 级别。
      # 原 -lll 会漏报 B310（pickle RCE）等 Medium 风险。现通过 .bandit 配置文件
      # 显式管理安全豁免（如正当使用 pickle 的位置），而非一刀切忽略整个 Medium 级别。
      - run: bandit -r maop/ -ll -c .bandit  # fail on low severity and above
      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-report
          path: py/bandit-report.json

  # ── CodeQL (GitHub native SAST) ────────────────────────────────
  # 补充 bandit 之外的语义级代码安全分析（taint tracking、SQL injection、
  # path traversal 等）。对 Python + JavaScript/TypeScript 代码运行分析。
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write  # 上传 CodeQL 告警需要
      actions: read            # CodeQL autobuild 可能需要读取 action 元数据
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript']
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # 使用默认的 security-and-quality 查询套件
          queries: security-and-quality
      - name: Autobuild (Python)
        if: matrix.language == 'python'
        uses: github/codeql-action/autobuild@v3
        with:
          working-directory: py
      - name: Autobuild (JavaScript)
        if: matrix.language == 'javascript'
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ── Dependency Review (PR only) ────────────────────────────────
  # 在 PR 时检查依赖变更是否有已知漏洞（补充 pip-audit 的 PR 级别检查）。
  # 仅在 pull_request 事件触发时运行，比较 base 和 head 的依赖差异。
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # 拒绝 Critical + High 级别漏洞
          fail-on-severity: high
          # 同时检查 Python 和 Node.js 依赖清单
          dependency-manifest: |
            py/requirements.lock
            dashboard/package-lock.json
            dashboard-enterprise/package-lock.json

  # ── Secret Scan (gitleaks) ─────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for secret scan
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── SBOM (cyclonedx) ───────────────────────────────────────────
  sbom:
    name: SBOM (cyclonedx)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install cyclonedx-bom
      - run: cyclonedx-py requirements -o sbom.json -i requirements.lock
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: maop-sbom
          path: py/sbom.json

  # ── Container Scan (trivy) ─────────────────────────────────────
  container-scan:
    name: Container Scan (trivy)
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scan
        run: docker build -f py/Dockerfile -t maop:scan .
      - name: Run trivy vulnerability scan
        # 非阻塞模式：生成报告但不让 CI 失败（报告仍上传供审查）
        # ignore-unfixed: 只报告有可用修复的漏洞，忽略上游未修复的
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: maop:scan
          format: json
          output: trivy-report.json
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
      - name: Upload container scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-scan
          path: trivy-report.json
  # ── Publish to PyPI ─────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, frontend, e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build packages
        run: |
          pip install build
          python -m build

      - name: Publish maop
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ── Compose Smoke Test（仅冒烟，非部署；真实部署能力待建，见 P1-3 方案 B）─────────────────────────────────────────
  compose-smoke:
    name: Compose Smoke
    runs-on: ubuntu-latest
    needs: [test, frontend, e2e, docker]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Compose up (smoke)
        run: |
          docker compose -f docker-compose.yml up -d --build
          sleep 10
          curl -sf http://localhost:9079/api/health || exit 1

      - name: Run smoke tests
        run: |
          curl -sf http://localhost:9079/api/health | grep -q '"status"'
          curl -sf http://localhost:9079/api/info | grep -q '"version"'
          echo "Compose smoke tests passed."

      - name: Notify on failure
        if: failure()
        run: echo "::warning::Compose smoke failed — check logs."

  # ── Deploy to Staging ────────────────────────────────────────────
  # P2-4 fix: 添加 staging 部署步骤。仅 main/master push 触发，依赖 docker
  # job 产出的镜像。使用 GitHub Environments 保护部署（需 reviewer approval
  # 若 environment 配置了 required reviewers）。部署失败自动触发 rollback job。
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker, compose-smoke]
    # 仅主分支 push 部署（PR 不部署，develop 走 compose-smoke 冒烟）
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: staging
      url: https://staging.maop.example.com
    # 部署 job 需要写权限以创建 deployment status
    permissions:
      contents: read
      packages: read
      deployments: write
    env:
      DEPLOY_TARGET: staging
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Create deployment status (in_progress)
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'staging',
              required_contexts: [],
              auto_merge: false,
              transient_environment: true,
              production_environment: false,
            });
            core.setOutput('deployment_id', deployment.data.id);
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Configure deployment target
        run: |
          echo "Deploying image tag: ${IMAGE_TAG}"
          echo "Deploy target: ${DEPLOY_TARGET}"
          # 写入部署清单供 rollback 使用
          mkdir -p .deploy
          cat > .deploy/manifest.json <<EOF
          {
            "image_tag": "${IMAGE_TAG}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit_sha": "${{ github.sha }}",
            "environment": "${DEPLOY_TARGET}",
            "previous_tag": "${{ github.event.before }}"
          }
          EOF
          cat .deploy/manifest.json

      - name: Pull and deploy image
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASS: ${{ secrets.REGISTRY_PASS }}
          # SSH 部署密钥（staging 主机）
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          # 检查必要的 secrets 是否配置
          if [ -z "$STAGING_SSH_HOST" ]; then
            echo "::warning::STAGING_SSH_HOST 未配置，跳过实际部署（仅记录清单）"
            exit 0
          fi
          # 配置 SSH
          mkdir -p ~/.ssh
          echo "$STAGING_SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "$STAGING_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # 远程拉取新镜像并滚动更新
          ssh -i ~/.ssh/staging_key "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" \
            "docker compose -f /opt/maop/docker-compose.prod.yml pull && \
             docker compose -f /opt/maop/docker-compose.prod.yml up -d --no-deps --build && \
             sleep 15 && \
             curl -sf http://localhost:9079/api/health" || {
               echo "::error::Staging 部署失败"
               exit 1
             }
          echo "Staging 部署成功"

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest-staging
          path: .deploy/manifest.json
          retention-days: 30

      - name: Mark deployment success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.deployment_id }},
              state: 'success',
              environment_url: 'https://staging.maop.example.com',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Mark deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.deployment_id }},
              state: 'failure',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  # ── Rollback on Deploy Failure ───────────────────────────────────
  # P2-4 fix: 部署失败时自动回滚到上一个版本。也可通过 workflow_dispatch
  # 手动触发回滚（inputs.rollback=true）。回滚使用 GitHub Environments
  # 保护，需要 rollback_url secret 指向 staging 主机。
  rollback:
    name: Rollback Staging
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    # 触发条件：deploy-staging 失败，或手动触发回滚
    if: |
      always() &&
      (
        (needs.deploy-staging.result == 'failure') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.rollback == 'true')
      )
    environment:
      name: staging-rollback
      url: https://staging.maop.example.com
    permissions:
      contents: read
      packages: read
      deployments: write
    env:
      ROLLBACK_TARGET: staging
    steps:
      - uses: actions/checkout@v4

      - name: Identify rollback target
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 优先使用 push event 的 before SHA（上一个成功部署的 commit）
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            ROLLBACK_TAG="${{ github.event.before }}"
            echo "使用 push before SHA 作为回滚目标: ${ROLLBACK_TAG}"
          else
            # 手动触发或无法获取 before SHA：查询最近成功的 deployment
            echo "查询最近成功的 staging deployment..."
            ROLLBACK_TAG=$(gh api \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/deployments \
              --jq '[.[] | select(.environment=="staging" and .state=="success")] | .[1].sha // empty' \
              2>/dev/null || echo "")
            if [ -z "$ROLLBACK_TAG" ]; then
              echo "::error::无法确定回滚目标：没有找到上一个成功的 staging deployment"
              exit 1
            fi
            echo "使用上一个成功 deployment SHA: ${ROLLBACK_TAG}"
          fi
          echo "rollback_tag=${ROLLBACK_TAG}" >> "$GITHUB_OUTPUT"
          echo "回滚目标: ${ROLLBACK_TAG}"

      - name: Create rollback deployment status
        id: rollback-deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ steps.target.outputs.rollback_tag }}',
              environment: 'staging',
              required_contexts: [],
              auto_merge: false,
              transient_environment: false,
              production_environment: false,
              description: 'Rollback deployment',
            });
            core.setOutput('deployment_id', deployment.data.id);
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Execute rollback on staging
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          ROLLBACK_TAG: ${{ steps.target.outputs.rollback_tag }}
        run: |
          echo "回滚 staging 到镜像 tag: ${ROLLBACK_TAG}"
          if [ -z "$STAGING_SSH_HOST" ]; then
            echo "::warning::STAGING_SSH_HOST 未配置，跳过实际回滚（仅记录）"
            exit 0
          fi
          # 配置 SSH
          mkdir -p ~/.ssh
          echo "$STAGING_SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "$STAGING_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # 远程回滚：拉取旧镜像并重启
          ssh -i ~/.ssh/staging_key "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" \
            "export MAOP_IMAGE_TAG=${ROLLBACK_TAG} && \
             docker compose -f /opt/maop/docker-compose.prod.yml pull && \
             docker compose -f /opt/maop/docker-compose.prod.yml up -d --no-deps && \
             sleep 15 && \
             curl -sf http://localhost:9079/api/health" || {
               echo "::error::Staging 回滚失败"
               exit 1
             }
          echo "Staging 回滚成功"

      - name: Mark rollback success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.rollback-deployment.outputs.deployment_id }},
              state: 'success',
              environment_url: 'https://staging.maop.example.com',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.notice('Rollback to ${{ steps.target.outputs.rollback_tag }} succeeded');

      - name: Mark rollback failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.rollback-deployment.outputs.deployment_id }},
              state: 'failure',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.error('Rollback failed — manual intervention required');
