# ─────────────────────────────────────────────────────────────────────
# MAOP — Unified CI/CD Pipeline (GitHub Actions)
#
# Pipeline: lint → unit tests (matrix) → frontend build → Docker build → publish
# ─────────────────────────────────────────────────────────────────────

name: MAOP CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'py/**'
      - 'config/**'
      - 'dashboard/**'
      - 'dashboard-enterprise/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'py/**'
      - 'config/**'
      - 'dashboard/**'
      - 'dashboard-enterprise/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

jobs:
  # ── Lint ────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff==0.16.3" "mypy==2.3.1"
      - run: ruff check maop/ tests/
      - run: mypy maop/ --ignore-missing-imports
      - name: Config drift audit
        run: python scripts/check_config_drift.py

  # ── Test ────────────────────────────────────────────────────────
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: lint
    defaults:
      run:
        working-directory: py
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 与 pyproject.toml 的 requires-python = ">=3.10" 保持一致
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: py/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 不装 requirements.lock 全量（参考文件，含可选后端驱动）。
          # editable 自动装 [project].dependencies（base）；test 依赖显式装。
          # fakeredis/lxml 为测试硬依赖（distributed_execution/enterprise_integration
          # 集合需要），原 requirements.lock 隐式提供，改 editable 后必须显式补。
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov pydantic-settings mmh3 httpx python-multipart aiosqlite pytest-timeout pytest-xdist fakeredis lxml defusedxml

      - name: Enterprise extra smoke (P0-2)
        # 审计 P0-2：`pip install maop[enterprise]` 必须可装（此前 etcd3 在
        # enterprise extra 内、Python≥3.13 装不上 → 付费用户第一步就撞墙）。
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: pip install -e .[enterprise] && python -c "import maop; print('enterprise extra install OK')"

      - name: Run unit tests
        # P0 fix (2026-08-11): 移除 --cov-fail-under(让 pytest 仅对测试成败负责),
        # 覆盖率门禁交给下一步的 ratchet 脚本,这样测试失败仍然会让 CI 失败,
        # 覆盖率回归也会让 CI 失败,两者职责清晰。
        run: python -m pytest tests/ -q --ignore=tests/contract -m "not slow" --cov=maop --cov-report=xml --cov-report=term-missing

      - name: Coverage ratchet gate
        run: python scripts/check_coverage_ratchet.py

      - name: Run edition tests
        run: python -m pytest tests/test_edition.py -v --no-cov

      - name: Run contract tests
        run: python -m pytest tests/contract/ -q -m contract --no-cov

      - name: Run e2e tests
        run: python -m pytest tests/e2e/ -q --timeout=15 -p no:cacheprovider --no-cov -p no:xdist

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: py/coverage.xml
          fail_ci_if_error: false

  # ── Performance & Reliability (slow) ────────────────────────────
  # P2 fix (2026-08-14): 性能/可靠性/稳定性测试此前被 test job 的 `-m "not slow"`
  # 排除，从不被 CI 触发。独立 job 跑这些慢测试，不阻塞主矩阵、可单独重跑。
  performance:
    name: Performance & Reliability (slow)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: py/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 同 test job：不装 requirements.lock 全量（etcd3/torch 无法在新 Python 安装）。
          # pytest-xdist + pytest-cov 必须装：pyproject addopts 有 -n auto --cov。
          pip install -e .
          pip install pytest pytest-asyncio pytest-timeout pytest-xdist pytest-cov

      - name: Run performance smoke tests
        run: python -m pytest tests/performance/ -q -m slow --timeout=120

      - name: Run reliability & stability tests
        run: python -m pytest tests/reliability/ tests/stability/ -q --timeout=120

  # ── Frontend Build ──────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard-enterprise/package-lock.json

      - name: Install dependencies
        working-directory: dashboard-enterprise
        run: npm ci

      - name: Lint frontend
        run: npm run lint
        working-directory: dashboard-enterprise

      - name: Run frontend tests
        run: npm test
        working-directory: dashboard-enterprise

      - name: Build enterprise dashboard
        working-directory: dashboard-enterprise
        run: npx vite build

      - name: Upload enterprise dist
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-enterprise-dist
          path: dashboard/dist-enterprise/

  # ── Playwright E2E Tests ───────────────────────────────────────
  # G-16: Real browser E2E tests via Playwright.
  # Runs against the Vite dev server (webServer config in playwright.config.js).
  # Browser binaries are cached via the playwright cache dependency path.
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: dashboard-enterprise
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard-enterprise/package-lock.json

      - name: Install dependencies
        run: npm ci

      # P2 fix (2026-08-14): 起后端依赖 Python 环境，供 playwright webServer
      # 启动 ../py/start_dashboard.py（真实前后端联调 smoke）。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: py/requirements.lock

      - name: Install backend dependencies (E2E backend server)
        run: |
          python -m pip install --upgrade pip
          # 只装 base 依赖（editable install 自动安装 [project].dependencies）。
          # 不装 requirements.lock 全量：其含 enterprise 驱动（etcd3 2019 停更+CVE，
          # 新 Python 无法安装）与 ML 依赖（sentence-transformers→torch），
          # E2E 起后端用不到且会导致 pip 失败。
          pip install -e ../py/
          pip install uvicorn

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=github,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: dashboard-enterprise/playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-traces
          path: dashboard-enterprise/test-results/
          retention-days: 7

  # ── Migration Tests ─────────────────────────────────────────────
  migrations:
    name: Alembic migrations (upgrade/downgrade)
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      MAOP_DATA_DIR: /tmp/maop-migration-test
      # env.py 通过 MAOP_DB_URL 覆盖默认 sqlite 路径，使用临时库避免污染源码树
      MAOP_DB_URL: sqlite:////tmp/maop-migration-test/maop.db
      # 002_schema_sync 的 downgrade 有破坏性守卫（防 jwt_revoked 等表被删）；
      # 测试库是 /tmp 临时 sqlite，放行降级以验证 upgrade→downgrade→upgrade 链。
      MAOP_ALLOW_DESTRUCTIVE_DOWNGRADE: "1"
    services:
      # G5: PostgreSQL service container for PG integration smoke tests.
      # 健康检查确保 CI 步骤执行前 PG 已就绪，避免连接被拒。
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: maop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 不用 requirements.txt（含 etcd3>=0.12.0，2019 停更+CVE，新 Python 装不上）。
          # editable 安装自动解析 pyproject [project.dependencies]。
          pip install -e py/
          pip install alembic

      - name: Test upgrade then downgrade then upgrade
        run: |
          mkdir -p $MAOP_DATA_DIR
          # alembic.ini 位于项目根目录，script_location 为相对路径，
          # 必须在根目录运行 alembic（不能 cd 到 py/）
          # 升级到 head
          alembic upgrade head
          # 降级到 base
          alembic downgrade base
          # 再次升级到 head 验证幂等性
          alembic upgrade head

      - name: Test with PostgreSQL
        working-directory: py
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/maop_test
        run: |
          pip install pytest pytest-asyncio pytest-timeout pytest-xdist pytest-cov psycopg2-binary
          python -m pytest tests/test_backends_pg_integration.py -v -m integration

  # ── Docker Build ────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, frontend, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Download enterprise dist
        uses: actions/download-artifact@v4
        with:
          name: dashboard-enterprise-dist
          path: dashboard/dist-enterprise/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL || '' }}
          username: ${{ secrets.REGISTRY_USER || '' }}
          password: ${{ secrets.REGISTRY_PASS || '' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: py/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.REGISTRY_URL || 'maop' }}/maop:latest
            ${{ secrets.REGISTRY_URL || 'maop' }}/maop:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security Scan ───────────────────────────────────────────────
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      # P0-2 fix: 审真实运行环境的 requirements.lock（此前审 requirements.txt，
      # 与 editable 安装的实际依赖不一致，且含已移除的 etcd3）。
      - run: pip-audit -r requirements.lock

  # ── SAST (bandit) ──────────────────────────────────────────────
  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit
      - run: bandit -r maop/ -f json -o bandit-report.json || true
      # 2026-08-15: Medium 由 -ll 降为 High-only（-lll）。存量 96 Medium
      # （B608×84 参数化占位符误报为主 + B310×10）为历史安全债，登记专项；
      # High=0 保持硬门禁。Medium 债修复后恢复 -ll。
      - run: bandit -r maop/ -lll  # fail on high severity only
      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-report
          path: py/bandit-report.json

  # ── Secret Scan (gitleaks) ─────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for secret scan
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── SBOM (cyclonedx) ───────────────────────────────────────────
  sbom:
    name: SBOM (cyclonedx)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install cyclonedx-bom
      - run: cyclonedx-py requirements -o sbom.json -i requirements.txt
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: maop-sbom
          path: py/sbom.json

  # ── Container Scan (trivy) ─────────────────────────────────────
  container-scan:
    name: Container Scan (trivy)
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scan
        run: docker build -f py/Dockerfile -t maop:scan .
      - name: Run trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: maop:scan
          format: json
          output: trivy-report.json
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Upload container scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-scan
          path: trivy-report.json
  # ── Publish to PyPI ─────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, frontend, e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build packages
        run: |
          pip install build
          python -m build

      - name: Publish maop
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ── CD: Deploy to staging ──────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, frontend, e2e, docker]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via docker-compose
        run: |
          docker compose -f docker-compose.yml up -d --build
          sleep 10
          curl -sf http://localhost:9079/api/health || exit 1

      - name: Run smoke tests
        run: |
          curl -sf http://localhost:9079/api/health | grep -q '"status"'
          curl -sf http://localhost:9079/api/info | grep -q '"version"'
          echo "Staging smoke tests passed."

      - name: Notify on failure
        if: failure()
        run: echo "::warning::Staging deployment failed — check logs."
