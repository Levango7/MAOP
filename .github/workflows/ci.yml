# ─────────────────────────────────────────────────────────────────────
# MAOP — Unified CI/CD Pipeline (GitHub Actions)
#
# Pipeline: lint → unit tests (matrix) → frontend build → Docker build → publish
# ─────────────────────────────────────────────────────────────────────

name: MAOP CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'py/**'
      - 'config/**'
      - 'dashboard/**'
      - 'dashboard-enterprise/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'py/**'
      - 'config/**'
      - 'dashboard/**'
      - 'dashboard-enterprise/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

jobs:
  # ── Lint ────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff mypy
      - run: ruff check maop/ tests/
      - run: mypy maop/ --ignore-missing-imports

  # ── Test ────────────────────────────────────────────────────────
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: lint
    defaults:
      run:
        working-directory: py
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 与 pyproject.toml 的 requires-python = ">=3.10" 保持一致
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: py/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov pydantic-settings mmh3 httpx python-multipart aiosqlite pytest-timeout

      - name: Run unit tests
        run: python -m pytest tests/ -q --ignore=tests/contract -m "not slow" --cov=maop --cov-report=xml --cov-report=term-missing --cov-fail-under=60

      - name: Run edition tests
        run: python -m pytest tests/test_edition.py -v

      - name: Run contract tests
        run: python -m pytest tests/contract/ -q -m contract

      - name: Run e2e tests
        run: python -m pytest tests/e2e/ -q --timeout=15 -p no:cacheprovider

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: py/coverage.xml
          fail_ci_if_error: false

  # ── Frontend Build ──────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard-enterprise/package-lock.json

      - name: Install dependencies
        working-directory: dashboard-enterprise
        run: npm ci

      - name: Run frontend tests
        run: npm test
        working-directory: dashboard-enterprise

      - name: Build enterprise dashboard
        working-directory: dashboard-enterprise
        run: npx vite build

      - name: Upload enterprise dist
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-enterprise-dist
          path: dashboard/dist-enterprise/

  # ── Migration Tests ─────────────────────────────────────────────
  migrations:
    name: Alembic migrations (upgrade/downgrade)
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      MAOP_DATA_DIR: /tmp/maop-migration-test
      # env.py 通过 MAOP_DB_URL 覆盖默认 sqlite 路径，使用临时库避免污染源码树
      MAOP_DB_URL: sqlite:////tmp/maop-migration-test/maop.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r py/requirements.txt
          pip install alembic

      - name: Test upgrade then downgrade then upgrade
        run: |
          mkdir -p $MAOP_DATA_DIR
          # alembic.ini 位于项目根目录，script_location 为相对路径，
          # 必须在根目录运行 alembic（不能 cd 到 py/）
          # 升级到 head
          alembic upgrade head
          # 降级到 base
          alembic downgrade base
          # 再次升级到 head 验证幂等性
          alembic upgrade head

      - name: Test with PostgreSQL
        if: false  # 暂时禁用，需要 postgres service
        run: |
          # TODO: 加 postgres service container 后启用
          echo "PostgreSQL migration test - pending postgres service setup"

  # ── Docker Build ────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Download enterprise dist
        uses: actions/download-artifact@v4
        with:
          name: dashboard-enterprise-dist
          path: dashboard/dist-enterprise/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL || '' }}
          username: ${{ secrets.REGISTRY_USER || '' }}
          password: ${{ secrets.REGISTRY_PASS || '' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: py/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.REGISTRY_URL || 'maop' }}/maop:latest
            ${{ secrets.REGISTRY_URL || 'maop' }}/maop:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security Scan ───────────────────────────────────────────────
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  # ── Publish to PyPI ─────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build packages
        run: |
          pip install build
          python -m build

      - name: Publish maop
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
