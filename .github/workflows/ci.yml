# ─────────────────────────────────────────────────────────────────────
# MAOP — Unified CI/CD Pipeline (GitHub Actions)
#
# Pipeline: lint → unit tests (matrix) → frontend build → Docker build → publish
# ─────────────────────────────────────────────────────────────────────

name: MAOP CI

on:
  push:
    branches: [main, master, develop]
    # 2026-10-06：补 tag 触发，让 `publish` 作业的 `if: ... refs/tags/v` 真的可能成立。
    # 此前 `on.push` 只有 branches，而 GitHub 的 branches 过滤会**排除所有 tag push** ——
    # publish 因此自 2026-09-29 复核起一直是"永不产生"的死作业（当时只在注释里认错，
    # 没改行为）。守卫见 py/tests/test_ci_publish_reachable.py。
    # 影响面：只多响应 tag push 事件；branch/PR 行为逐字不变；`Publish to PyPI`
    # 不在 .github/ci-required-checks.json 的 required 清单里，不会拦住任何合并。
    tags: ['v*']
  pull_request:
    # develop 是长期集成分支（BRANCH_STRATEGY：feature/fix 的 PR 目标即 develop），
    # 2026-09-29 补上；此前 PR 目标为 develop 时整个 workflow 不触发。
    branches: [main, master, develop]
  workflow_dispatch:

# F-P1-4 fix: cancel superseded CI runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# F-P1-5 fix: least-privilege default token (contents: read only).
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  # 2026-09-27: 20 → 24。jsdom@30 与 vitest@5 的 engines 都是
  # `^22.22.2 || ^24.15.0 || >=26.0.0`；node 20 下 vitest 5 会在 import jsdom→undici 时
  # 直接 56 个测试文件报错（见 #40 的 Frontend Build 日志），属于跑不受支持的组合。
  NODE_VERSION: "24"

jobs:
  # ── CI scope：把"要不要跑重活"从 workflow 触发层搬到 job 级 ──────────────
  # 原先用 `on.pull_request.paths` 白名单，问题不是"少跑一点"，而是**不匹配的 PR 整个
  # workflow 一条 check 都不产生** —— "CI 全绿"和"CI 没跑"在 API 上完全同形，
  # 本仓真被它骗过（一个只改 CHANGELOG.md 的 PR 被当成全绿合掉，见 CHANGELOG）。
  # 现在 PR 一律触发本 workflow，由这个作业明确报告 code / docs-only：
  # 跳过是**看得见**的状态，不是缺席。分类规则在 py/scripts/ci_path_scope.py，
  # 由 py/tests/test_ci_path_scope.py 钉住（含"白名单不许回来"的结构断言）。
  scope:
    name: CI scope (code vs docs-only)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            # 新分支或强推时 before 是空/全 0/对象不存在。此时**不再回退
            # head~1**（2026-09-29 修正）：新分支首推可能带多个提交，
            # diff head~1..head 只看到最后一个提交 —— 若最后一个是 docs
            # 改动而前面有代码改动，分类器会把整个 push 判成 docs-only 而
            # 跳过重活（"全绿"与"没跑"再次同形）。保持 base 为空，由
            # Collect changed files 走"无法确定则全量"的保守分支。
            if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base=""
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Collect changed files
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.base.outputs.base }}"; head="${{ steps.base.outputs.head }}"
          : > /tmp/ci_changed.txt
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git diff --name-only "$base" "$head" > /tmp/ci_changed.txt || : > /tmp/ci_changed.txt
          else
            echo "::notice::无法确定 diff 基线（新分支/浅历史）→ 按全量 CI 处理"
          fi
          echo "变更文件数: $(wc -l < /tmp/ci_changed.txt)  (base=${base:-none})"

      - name: Classify changeset
        id: classify
        working-directory: py
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci_path_scope.py --files-from /tmp/ci_changed.txt --github-output "$GITHUB_OUTPUT"
  # ── Lint ────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + mypy)
    needs: scope
    if: needs.scope.outputs.code == 'true'   # docs-only 时跳过（跳过可见，不像白名单那样静默）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff==0.16.3" "mypy==2.3.1"
      # FIX: mypy 必须在**依赖齐全**的环境里跑。此前本 job 只装 ruff+mypy，
      # 于是 pydantic / httpx / fastapi 等全部解析为 Any，产生了 12 个
      # no-any-return —— 这些在依赖齐全时并不存在（本地同版本 mypy 复核为
      # Success: no issues found in 468 source files）。
      # 缺依赖的类型检查等于没有检查，故补装项目依赖。
      - run: pip install -e .
      - run: ruff check maop/ tests/
      # 显式 --no-warn-unused-ignores：不依赖 pyproject [tool.mypy] 读取
      # （CI 依赖缺失环境下 type:ignore 大量 unused，pyproject 配置若未
      # 生效会误报红）。真实类型错误仍正常拦截。
      - name: mypy (diagnostic)
        run: |
          set +e
          mypy maop/ --ignore-missing-imports --no-warn-unused-ignores 2>&1 | tee /tmp/mypy-ci.log
          status=${PIPESTATUS[0]}
          {
            echo "### mypy output (exit=$status)"
            echo '```'
            tail -80 /tmp/mypy-ci.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Config drift audit
        run: python scripts/check_config_drift.py

      # 前后端 API 契约检查。单元测试**抓不到**这类缺陷：前端测试 mock 的是
      # 前端自己写的路径，等于用错误验证错误。2026-09-23 实测发现 19 处路径
      # 错配（告警规则/审计规则/SSO），且未注册路径会被 SPA 兜底返回
      # 200 + HTML，只查状态码完全发现不了。
      - name: API contract (frontend ↔ backend)
        run: python scripts/check_api_contract.py

      - name: Doc↔Code reconcile
        run: python scripts/doc_reconcile.py

  # ── Docs gate：文档-代码一致性（README + docs/）────────────────────────
  # 为什么不放进 lint job：lint 只在 code 变更时跑，而"只改文档"正是这个检查
  # 最该覆盖的场景；反过来"只删代码"也会让文档里的路径失效——所以两边都要跑，
  # 干脆做成独立作业、无条件执行。脚本只用标准库，读 115 个 md + 文件索引，
  # 本机约 3 秒，不属于本 workflow 要跳的"重活"。
  # 判定范围与豁免口径由脚本自己定义并逐条打印：只对 docs/README.md 第 1–6 章
  # 所列"当前权威文档"失败；历史快照/设计文档要豁免须在文件头写明理由。
  docs-gate:
    name: Docs consistency gate
    needs: scope
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Docs consistency (paths / counts / tables)
        run: python scripts/check_docs_consistency.py --gate

  # ── Test ────────────────────────────────────────────────────────
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: lint
    # P0 fix (2026-08-29): 兜底超时 —— 历史证据显示收尾挂起/慢测试可让 job
    # 无限运行（无显式 timeout 时 GitHub 默认 360 分钟）。50 分钟足够
    # 串行跑完整套件（windows -n 0），并行矩阵更快；超时即失败而非挂死。
    timeout-minutes: 50
    defaults:
      run:
        working-directory: py
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 与 pyproject.toml 的 requires-python = ">=3.10" 保持一致
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # P3-C-01 fix: macOS 仅跑最新 Python（3.13）以节省 CI 资源。
        # 项目是 Python 后端 + Vue 前端，macOS 矩阵主要验证平台兼容性，
        # 4 个 Python 版本全跑 macOS 价值有限（12 矩阵 → 9 矩阵）。
        exclude:
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: py/requirements.frozen.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 不装 requirements.lock 全量（参考文件，含可选后端驱动）。
          # editable 自动装 [project].dependencies（base）；test 依赖显式装。
          # fakeredis/lxml 为测试硬依赖（distributed_execution/enterprise_integration
          # 集合需要），原 requirements.lock 隐式提供，改 editable 后必须显式补。
          # P2-4: 测试依赖统一由 pyproject.toml [dev] extra 声明（单一真相源），
          # 避免在此手工罗列导致与 pyproject.toml 漂移。editable 安装同时拉取 base deps。
          pip install -e .[dev]

      - name: Enterprise extra smoke (P0-2)
        # 审计 P0-2：`pip install maop-orchestrator[enterprise]` 必须可装（此前 etcd3 在
        # enterprise extra 内、Python≥3.13 装不上 → 付费用户第一步就撞墙）。
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: pip install -e .[enterprise] && python -c "import maop; print('enterprise extra install OK')"

      - name: Detect enterprise package
        # H4 修复：显式检测 py/maop/enterprise/ 是否存在，输出明确告警。
        # 替代原 --ignore 列表静默跳过的方式，让 CI 日志清晰可见。
        shell: bash
        run: |
          if [ -d maop/enterprise ] && python -c "import maop.enterprise" 2>/dev/null; then
            echo "ENTERPRISE_AVAILABLE=true" >> "$GITHUB_ENV"
            echo "::notice::maop.enterprise 包存在，将运行企业版测试"
          else
            echo "ENTERPRISE_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "::warning::maop.enterprise 包不存在，跳过企业版测试（已通过 pytest.skip 显式标注）"
          fi

      - name: Run unit tests
        # ADR-017: 企业代码已移至私有仓库 MAOS，企业测试条件化运行
        # 个人版 CI 不运行企业测试（maop.enterprise 不可导入）
        # P0 fix (2026-08-11): 移除 --cov-fail-under(让 pytest 仅对测试成败负责),
        # 覆盖率门禁交给下一步的 ratchet 脚本,这样测试失败仍然会让 CI 失败,
        # 覆盖率回归也会让 CI 失败,两者职责清晰。
        # H4 修复：移除原 --ignore 列表（22 个文件静默跳过），改为依赖测试文件
        # 内的 pytest.skip(reason="maop.enterprise 未发布") 显式跳过。这样测试
        # 报告中会显式统计跳过数，而非通过 --ignore 静默排除。
        # --timeout=60: 防挂起测试无限等待(历史: pg_persist 池重试/PowerShell
        # 冷启动曾让 windows job 卡 25-30 分钟)。任何单测挂起 60s 即失败,
        # 错误定位到具体测试而非整个 job 卡死。
        # --reruns=3 --reruns-delay=2: auto-retry flaky tests up to 3 times
        # with 2s delay. Evidence: CI #136 all-green, #137 (lint-only change)
        # Ubuntu 3.10 failed, #138 Win 3.11 failed — classic flaky pattern
        # where failures randomly appear on different platforms across runs.
        # --junitxml: export results for artifact upload (debugging future flakes).
        # P0 fix (2026-08-29): Windows + pytest-xdist 存在 execnet worker 竞态
        # (INTERNALERROR: KeyError: WorkerController) — 本地 Windows 与 CI
        # windows-latest 均可稳定复现（xdist 3.8.0）。Windows 平台禁用 xdist
        # 串行运行（-n 0 覆盖 pyproject addopts 的 -n auto）；Linux/macOS 并行。
        # 并发收敛：CI -n auto（4 worker）多次快速失败，本地 -n 2 全量验证通过，
        # 高并发下共享资源（data/ 真实 SQLite、固定端口）冲突是主嫌疑 → 统一 -n 2。
        shell: bash
        run: |
          XDIST_ARGS="-n 2"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            XDIST_ARGS="-n 0"
          fi
          set +e
          python -m pytest tests/ -q --ignore=tests/contract \
            -m "not slow and not serial" --cov=maop --cov-report=xml --cov-report=term-missing \
            --timeout=60 --reruns=3 --reruns-delay=2 --junitxml=test-results.xml $XDIST_ARGS
          unit_code=$?
          set -e
          echo "unit tests exit code: ${unit_code}"
          if [ "$unit_code" -ne 0 ]; then
            # 2026-08-30: unit tests failed on ALL 9 platforms on 4498f4e while
            # identical code + env passes locally (CI-mirrored 7403 green).
            # Surface the failing test IDs from the junit xml as annotations so
            # they are readable via the check-runs API without log download.
            # This does NOT alter the step's exit code — $unit_code is re-raised.
            python scripts/junit_annotate.py test-results.xml || true
            exit "$unit_code"
          fi

      - name: Run serial tests (fixed port / shared state)
        # pyproject [tool.pytest.ini_options] markers 声明了 serial 机制
        # （"Selected by CI's serial step (-n 0)"），但 ci.yml 从未实现该步骤。
        # serial 标记测试（共享 server app 全局状态）必须串行，补上缺失步骤。
        # 修复(2026-08-30): serial step 原用 --no-cov，其覆盖不进 coverage.xml，
        # ratchet 只看到主 step 的 ~80%（低于 81% baseline）→ 9 平台全挂覆盖率
        # 门禁而测试全过。改为 --cov-append 合流到同一 coverage.xml，ratchet
        # 读到主+serial 的完整覆盖（本地实测 81.59%）。注意: 不能用 --no-cov
        # + 依赖主 step 数据——append 模式下本 step 若不收集则数据面缺 serial。
        shell: bash
        run: |
          python -m pytest tests/ -q --ignore=tests/contract \
            -m "not slow and serial" -n 0 \
            --cov=maop --cov-append --cov-report=xml \
            --timeout=60 --reruns=3 --reruns-delay=2 --junitxml=test-results-serial.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: py/test-results.xml
          retention-days: 7

      - name: Upload coverage data (debug ratchet failures)
        # 2026-08-30: ratchet 失败时需要 coverage.xml 定位平台差异（ubuntu 挂
        # 而 macOS 过），此前不传 artifact 导致只能盲猜。失败也上传。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: py/coverage.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Coverage ratchet gate (核心包门禁)
        # H3 修复：移除 `if python -c "import maop.enterprise"` 条件（该条件
        # 永远为假，导致覆盖率门禁从未执行）。改为无条件执行核心包门禁，
        # 企业包门禁单独拆分为可选步骤（仅当 enterprise 存在时执行）。
        # 核心包门禁始终执行，确保覆盖率回退被 CI 阻断。
        # 2026-08-30: ratchet 输出写入 step summary，无需拉日志即可在
        # GitHub UI 看到 FAIL 行的实测/基线数字（ubuntu 挂 macOS 过的平台
        # 差异此前无法定量）。
        shell: bash
        run: |
          set +e
          python scripts/check_coverage_ratchet.py | tee /tmp/ratchet.log
          code=${PIPESTATUS[0]}
          {
            echo "### Coverage ratchet (${{ matrix.os }}, Python ${{ matrix.python-version }})"
            echo '```'
            cat /tmp/ratchet.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Coverage ratchet gate (企业包门禁，可选)
        # H3 修复：企业包门禁仅当 maop.enterprise 可导入时执行。
        # 个人版 CI 自动跳过，不影响核心包门禁。
        shell: bash
        run: |
          if python -c "import maop.enterprise" 2>/dev/null; then
            python scripts/check_coverage_ratchet.py --include="maop/enterprise/*" --fail-under=70
          else
            echo "::notice::maop.enterprise 未发布，跳过企业包覆盖率门禁"
          fi

      - name: Run edition tests
        run: python -m pytest tests/test_edition.py -v --no-cov

      - name: Run contract tests
        run: python -m pytest tests/contract/ -q -m contract --no-cov

      - name: Run e2e tests
        # e2e REQUIRES isolation: module-level MAOP_AUTH=1 must win over
        # tests/conftest.py's auth-off pinning (--confcutdir). Windows runners
        # died in ~1s with zero output on every prior multi-line bash variant
        # of this step (fallback loops, pipes, heredocs — all unverifiable);
        # reduced to single-command steps so each failure is individually
        # visible and no shell constructs can swallow the exit code.
        run: python -m pytest tests/e2e/ -q --timeout=60 -p no:cacheprovider --no-cov -n 0 --confcutdir=tests/e2e -ra --junitxml=test-results-e2e.xml

      - name: e2e failure annotations
        # Runs only when the e2e step failed. Reads the junit xml and emits
        # failing test IDs as ::error:: annotations (API-readable without log
        # download permissions). Never changes the job verdict.
        if: failure()
        run: python scripts/junit_annotate.py test-results-e2e.xml

      # 2026-09-28: 这里原来有一个 `- name: Upload coverage` 用 codecov/codecov-action@v4
      # 把 py/coverage.xml 传给 Codecov。**已删除**，理由不是嫌它旧，而是它从来没有成功过一次：
      # 本仓既没有 `CODECOV_TOKEN` secret，也没有 codecov.yml，上传一律被拒 ——
      # 每次 ubuntu/3.13 腿都打印
      #   error -- Commit creating failed: {"message":"Token required - not valid tokenless upload"}
      #   error -- Report creating failed / Upload queued for processing failed（同一原因）
      # 而步骤里写着 `fail_ci_if_error: false`，于是这些错误**永远不会让 job 变红**。
      # 净效果：每轮从 cli.codecov.io 下载并校验一个第三方二进制，产出为零，还会让人误以为
      # "覆盖率在别处也被看着"。真正的覆盖率约束在上面的 `check_coverage_ratchet.py` 与
      # `Upload coverage data` 产物里，删掉这一步不减少任何门禁。
      # 要恢复 Codecov：建 `CODECOV_TOKEN` secret，并用 `fail_ci_if_error: true` 重新加回
      # （否则又变成一个静默失败的假门禁）。

  # ── Perf script smoke + reliability/stability (NOT a load test) ──
  # 诚实化（2026-09-25）：原名 `performance` 会让人以为 CI 在跑真实负载压测。
  # 事实：py/tests/performance/ 下没有负载测试 —— test_performance_load.py 只有
  # 纯 CPU 断言 + skip 占位，test_performance_smoke.py 只对 k6/locust 脚本做
  # 文本/正则断言，k6 与 locust 从不执行。因此本 job 只提供「脚本语法 / 端点
  # 引用」级校验（外加 reliability/stability 套件），**不是性能门禁**：
  # docker / publish / compose-smoke 不再依赖它，不会因它变红或被阻塞。
  # 真实负载压测需人工在长跑环境以 k6 / locust 执行（见 py/tests/performance/）。
  perf-smoke:
    name: Perf Script Smoke + Reliability (non-load)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: py/requirements.frozen.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 同 test job：不装 requirements.lock 全量（etcd3/torch 无法在新 Python 安装）。
          # pytest-xdist + pytest-cov 必须装：pyproject addopts 有 -n auto --cov。
          pip install -e .
          pip install pytest pytest-asyncio pytest-timeout pytest-xdist pytest-cov

      - name: Run perf script smoke tests (k6/locust scripts are parsed, not executed)
        run: python -m pytest tests/performance/ -q -m slow --timeout=120 --junitxml=test-results-perf.xml

      - name: Run reliability & stability tests
        # 0074b97: this step failed on CI while the identical suites pass
        # locally (31 green). junitxml + annotate so the failing IDs are
        # readable via the API.
        run: |
          set +e
          python -m pytest tests/reliability/ tests/stability/ -q --timeout=120 --junitxml=test-results-rel.xml
          code=$?
          if [ "$code" -ne 0 ]; then
            python scripts/junit_annotate.py test-results-rel.xml || true
            exit "$code"
          fi

  # ── Frontend Build ──────────────────────────────────────────────
  frontend:
    name: Frontend Build
    needs: scope
    if: needs.scope.outputs.code == 'true'   # docs-only 时跳过（跳过可见，不像白名单那样静默）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard-enterprise/package-lock.json

      - name: Install dependencies
        working-directory: dashboard-enterprise
        run: npm ci

      - name: Lint frontend
        run: npm run lint
        working-directory: dashboard-enterprise

      - name: Type check (vue-tsc)
        run: npm run typecheck
        working-directory: dashboard-enterprise

      - name: Run frontend tests
        run: npm test
        working-directory: dashboard-enterprise

      - name: Frontend coverage gate
        # 2026-09-27: `test:coverage` 此前只存在于 package.json，CI 从不跑它 ——
        # 也就是 vitest.config.js 里的阈值达标与否**从来没人验证过**（今天首次实测即 exit=1，
        # 因为 2026-09-17 把阈值抬到 60/60/50/60 时没量过）。
        # 另一层理由：`npm test` 在冷启动丢 worker 的情况下会"半程绿灯"（实测只跑 25/56 文件仍报过），
        # 覆盖率下限时这种漏跑一定会把总数打下来，所以这一步同时是"测试真的都跑了"的机械哨兵。
        # 阈值只许往上抬；要降必须连带说明为什么，并走人工复核（同后端 ratchet 的纪律）。
        run: npm run test:coverage
        working-directory: dashboard-enterprise

      - name: Upload frontend coverage report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: dashboard-enterprise/coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build enterprise dashboard
        working-directory: dashboard-enterprise
        run: npx vite build

      - name: Upload enterprise dist
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-enterprise-dist
          path: dashboard/dist-enterprise/

  # ── Playwright E2E Tests ───────────────────────────────────────
  # G-16: Real browser E2E tests via Playwright.
  # Runs against the Vite dev server (webServer config in playwright.config.js).
  # Browser binaries are cached via the playwright cache dependency path.
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend
    defaults:
      run:
        working-directory: dashboard-enterprise
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard-enterprise/package-lock.json

      - name: Install dependencies
        run: npm ci

      # P2 fix (2026-08-14): 起后端依赖 Python 环境，供 playwright webServer
      # 启动 ../py/start_dashboard.py（真实前后端联调 smoke）。
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: py/requirements.frozen.txt

      - name: Install backend dependencies (E2E backend server)
        run: |
          python -m pip install --upgrade pip
          # 只装 base 依赖（editable install 自动安装 [project].dependencies）。
          # 不装 requirements.lock 全量：其含 enterprise 驱动（etcd3 2019 停更+CVE，
          # 新 Python 无法安装）与 ML 依赖（sentence-transformers→torch），
          # E2E 起后端用不到且会导致 pip 失败。
          pip install -e ../py/
          pip install uvicorn

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # FIX: playwright.config.js 声明了 chromium / firefox / webkit 三个
      # project，但此前这里只装 chromium，导致 firefox 与 webkit 启动时报
      # "Executable doesn't exist at .../firefox-1538/firefox/firefox"，
      # 两个浏览器的用例全部失败。改为安装配置中声明的全部浏览器。
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=github,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-report
          path: dashboard-enterprise/playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-traces
          path: dashboard-enterprise/test-results/
          retention-days: 7

  # ── Migration Tests ─────────────────────────────────────────────
  migrations:
    name: Alembic migrations (upgrade/downgrade)
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      MAOP_DATA_DIR: /tmp/maop-migration-test
      # env.py 通过 MAOP_DB_URL 覆盖默认 sqlite 路径，使用临时库避免污染源码树
      MAOP_DB_URL: sqlite:////tmp/maop-migration-test/maop.db
      # 002_schema_sync 的 downgrade 有破坏性守卫（防 jwt_revoked 等表被删）；
      # 测试库是 /tmp 临时 sqlite，放行降级以验证 upgrade→downgrade→upgrade 链。
      MAOP_ALLOW_DESTRUCTIVE_DOWNGRADE: "1"
    services:
      # G5: PostgreSQL service container for PG integration smoke tests.
      # 健康检查确保 CI 步骤执行前 PG 已就绪，避免连接被拒。
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: maop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # P3-C-02 fix: use env.PYTHON_VERSION (3.13) to match production.
          # Was hardcoded to "3.12" which is inconsistent with the production
          # runtime and the test matrix's latest version.
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 不用 requirements.txt（含 etcd3>=0.12.0，2019 停更+CVE，新 Python 装不上）。
          # editable 安装自动解析 pyproject [project.dependencies]。
          pip install -e py/
          pip install alembic

      - name: Test upgrade then downgrade then upgrade
        run: |
          mkdir -p $MAOP_DATA_DIR
          # alembic.ini 位于项目根目录，script_location 为相对路径，
          # 必须在根目录运行 alembic（不能 cd 到 py/）
          # 升级到 head
          alembic upgrade head
          # 降级到 base
          alembic downgrade base
          # 再次升级到 head 验证幂等性
          alembic upgrade head

      - name: Test with PostgreSQL
        working-directory: py
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/maop_test
        run: |
          pip install pytest pytest-asyncio pytest-timeout pytest-xdist pytest-cov psycopg2-binary
          python -m pytest tests/test_backends_pg_integration.py -v -m integration

  # ── Docker Build ────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    # 诚实化（2026-09-25）：不再依赖 perf-smoke —— 其前身 `performance` job
    # 只做脚本文本/正则校验（并恒因 skip 占位而形同虚设），不是负载门禁，
    # 不应阻塞 docker 构建。构建由 test / frontend / e2e 把关。
    needs: [test, frontend, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v7

      - name: Download enterprise dist
        uses: actions/download-artifact@v8
        with:
          name: dashboard-enterprise-dist
          path: dashboard/dist-enterprise/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # if: 表达式不能直接引用 secrets context（Unrecognized named-value:
      # 'secrets'，5e3174b 因此 workflow 解析失败）。先用 env 注入 secrets，
      # 探测步骤输出 configured=true/false，后续 if/push 只引用 steps context。
      - name: Check registry configured
        id: reg
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
        run: |
          if [ -n "$REGISTRY_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to Container Registry
        # 仅当仓库配置了 registry secrets 才登录；未配置（如公开仓库/无
        # 发布计划）时跳过登录且只构建不推送，避免 "Username and password
        # required" 失败（9c01b38 首次真正执行 docker job 时暴露）。
        if: github.event_name != 'pull_request' && steps.reg.outputs.configured == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_URL || '' }}
          username: ${{ secrets.REGISTRY_USER || '' }}
          password: ${{ secrets.REGISTRY_PASS || '' }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: py/Dockerfile
          # bb64973/64d2732: first real runs of this job (it sat behind the
          # failing test gate for 20+ rounds) exposed two issues:
          # (1) buildx "base name (${PYTHON_IMAGE}) should not be blank" —
          #     the ARG was declared AFTER the first FROM (not in the global
          #     FROM-interpolation scope); fixed in the Dockerfile by moving
          #     the ARG above every FROM.
          # (2) aliyun mirrors are slow/unreachable from GitHub runners —
          #     pass Docker Hub direct images explicitly.
          # 2026-09-29: node:20-alpine → node:24-alpine，与 env.NODE_VERSION 对齐。
          # 漂移的代价是"CI 绿 ≠ 镜像里也绿"：镜内 frontend-builder 跑同一个
          # lockfile 的 npm ci，而 jsdom@30.1.1 的 engines 是 ^22.22.2 || ^24.15.0
          # || >=26.0.0 —— node 20 不在支持区间（frontend/e2e job 在 node 20 上
          # 失败过，2026-09-27 才升的 24）。node 24 跑同一命令在 CI 已两个 job 全绿。
          build-args: |
            PYTHON_IMAGE=python:3.13-slim
            NODE_IMAGE=node:24-alpine
          push: ${{ github.event_name != 'pull_request' && steps.reg.outputs.configured == 'true' }}
          tags: |
            ${{ secrets.REGISTRY_URL || 'maop' }}/maop:latest
            ${{ secrets.REGISTRY_URL || 'maop' }}/maop:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security Scan ───────────────────────────────────────────────
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      # P0-2 fix: 审真实运行环境的锁文件（此前审 requirements.txt，与 editable
      # 安装的实际依赖不一致，且含已移除的 etcd3）。
      # T2.2 (2026-09-30): 换审 requirements.frozen.txt——uv 全量解析的精确 == 锁。
      # requirements.lock 的范围（>=,<）审的是"能落进范围的任意版本"，不是实际
      # 会部署的版本，漏洞结论会漂移。
      - run: pip-audit -r requirements.frozen.txt

  # ── Lock drift (T2.2) ─────────────────────────────────────────
  # requirements.frozen.txt 是唯一可复现锁（uv 全量解析、精确 ==，base+enterprise）。
  # 本作业重新编译并与提交版比对（剥注释、按内容比，忽略注释差异）；改了
  # pyproject.toml 不重新生成锁即红。requirements.lock 仍是"直依赖镜像参考"，
  # 由 tests/test_requirements_lock_sync.py 守卫，两文件分工见各自文件头。
  #
  # ⚠️ 2026-10-03 假红修复：冷启动编译发现上游两天内发了新版
  # （sqlalchemy 2.1.1→2.1.2 等）→ 与提交版 diff 判红——这不是漂移，是
  # "锁没追上游"的假红（每次上游发 patch 都要红一次，靠人肉重生成才能绿，
  # 违背门禁语义；去追新的活归 dependabot）。修法=偏好模式：先把提交版锁
  # cp 到输出路径再编译，uv 对已存在的输出文件默认以其 pin 为偏好集——
  # 只有 pyproject 约束收紧到既有 pin 不满足（或新增依赖）才会变，那才是
  # 真漂移。实测 `--no-cache` 下偏好来自输出文件本身、非 uv 缓存。
  lock-drift:
    name: Lock drift (uv pip compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # 钉与生成端一致的 uv 版本：uv 升级换解析算法会造成全量假漂移红灯。
      # 升级 uv 时需同步本机重生成 requirements.frozen.txt 并一起提交。
      - run: pip install "uv==0.11.30"
      - name: Recompile and diff (preference mode, comments ignored)
        run: |
          # 偏好模式：输出文件预置为提交版锁，uv 会以其 pin 为 preference 集。
          cp requirements.frozen.txt /tmp/frozen.check.txt
          uv pip compile pyproject.toml --extra enterprise --universal -o /tmp/frozen.check.txt
          grep -v '^\s*#' /tmp/frozen.check.txt | sed '/^\s*$/d' | sort > /tmp/a.txt
          grep -v '^\s*#' requirements.frozen.txt | sed '/^\s*$/d' | sort > /tmp/b.txt
          if ! diff -u /tmp/b.txt /tmp/a.txt; then
            echo "::error title=Lock drift::requirements.frozen.txt is out of sync with pyproject.toml — run: uv pip compile pyproject.toml --extra enterprise --universal -o requirements.frozen.txt"
            exit 1
          fi

  # ── SAST (bandit) ──────────────────────────────────────────────
  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit
      # P3-C-04 fix: split bandit report generation from the high-severity gate.
      # Previously `bandit -r maop/ -f json -o bandit-report.json || true` used
      # `|| true` to mask ALL failures (including config/import errors that
      # produce a missing/corrupt report). Now the report step uses
      # continue-on-error: true so a report generation failure is visible in
      # the step status but does not fail the job, and the upload step uses
      # if: always() to upload whatever exists.
      - name: Generate bandit report (JSON)
        continue-on-error: true
        run: bandit -r maop/ -f json -o bandit-report.json
      # 2026-08-15: Medium 由 -ll 降为 High-only（-lll）。存量 96 Medium
      # （B608×84 参数化占位符误报为主 + B310×10）为历史安全债，登记专项；
      # High=0 保持硬门禁。Medium 债修复后恢复 -ll。
      - run: bandit -r maop/ -lll  # fail on high severity only
      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-sast-report
          path: py/bandit-report.json

  # ── Secret Scan (gitleaks) ─────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      # 2026-10-03 重构：原作业扫全历史，一次性吐出 34 条历史发现后恒红，
      # 且真假混在一起（测试夹具/文档占位 vs 一条真实 QoderCN PAT）。改为两段：
      #   ① 新增提交 = HEAD-only 全规则扫描（--no-git 基线 = 本次 push 的新提交，
      #      红即真泄漏——这段不吃 allowlist，保证"新泄漏必红"）；
      #   ② 历史遗留 = 全量扫描 + .gitleaks.toml 逐条甄别后的 allowlist
      #      （33 条假阳性 + 1 条用户确认已吊销的真实凭据，含处置记录）。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 段② 需要全历史
      # 与 scope 作业同一保守逻辑（ci.yml:61 附近）：dispatch/新分支首推时
      # before 为空或不可解析 —— 此时段① 传空 base 给 gitleaks（`..HEAD` 退化成
      # 全量，等价于段②），不制造"新提交没扫到"的假绿。
      - name: Resolve comparison base
        id: glbase
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=""
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      # ① 新增提交 = 本次 push 引入的 commits（base = github.event.before）。
      #    这段吃 allowlist（路径/正则）——但新增真泄漏的路径或值形态都不在
      #    allowlist 里（allowlist 只含历史既有路径 + 已吊销那一条），
      #    实测：移除任一 allowlist 条目，对应历史 commit 立即重现（变异验证）。
      - name: New commits (base = push base)
        uses: gitleaks/gitleaks-action@v3.0.0
        with:
          args: --config .gitleaks.toml --log-opts=${{ steps.glbase.outputs.base }}..HEAD --redact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ② 历史遗留 = 全量扫描 + 逐条甄别后的 allowlist（33 条假阳性 +
      #    1 条用户确认已吊销的真实凭据，含处置记录，见 .gitleaks.toml 注释）。
      #    ⚠️ 必须用 CLI 而不是第二次 gitleaks-action：同 job 内两次 action 都会
      #    上传同名 artifact（gitleaks-results.sarif）→ HTTP 409 Conflict 假红
      #    （2026-10-03 实测 run 37094969085：两段扫描都报 no leaks found，步骤
      #    仍因 artifact 冲突失败）。这里直接跑 CLI 装到 job 上，段①的 action
      #    仍可上传它的产物名，两边不冲突。
      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          GL_VER=8.24.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks -C /usr/local/bin
          gitleaks version
      - name: History scan (triaged allowlist)
        run: |
          set -euo pipefail
          gitleaks git --config .gitleaks.toml . \
            --redact --report-format sarif --report-path gl-history.sarif
      - name: Upload history scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-history-report
          path: py/gl-history.sarif
          if-no-files-found: ignore

  # ── SBOM (cyclonedx) ───────────────────────────────────────────
  sbom:
    name: SBOM (cyclonedx)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install cyclonedx-bom
      # T2.2 (2026-09-30): SBOM 输入从 requirements.lock（范围参考）换为
      # requirements.frozen.txt（精确 == 真锁）——SBOM 必须描述实际会部署的版本。
      - run: cyclonedx-py requirements -o sbom.json -i requirements.frozen.txt
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: maop-sbom
          path: py/sbom.json

  # ── Container Scan (trivy) ─────────────────────────────────────
  container-scan:
    name: Container Scan (trivy)
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v7
      - name: Build image for scan
        # Explicit build-args (Docker Hub direct) — see the docker job's
        # "Build and push" step for the ARG-scope root cause.
        run: docker build -f py/Dockerfile --build-arg PYTHON_IMAGE=python:3.13-slim --build-arg NODE_IMAGE=node:24-alpine -t maop:scan .
      - name: Install trivy CLI
        # 5d80ce2: the trivy-action wrapper failed 3 rounds in a row with no
        # report and no diagnosable output. Install the CLI directly — its
        # stderr lands in the step log/annotations and nothing is hidden
        # behind the action's output plumbing. Pinned version, no floating
        # tags (supply-chain rule, P3-C-03). ef14bee: v0.65.0 does not exist
        # (curl 404 → exit 22); v0.74.0 asset verified via the releases API.
        run: |
          curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz -o /tmp/trivy.tgz
          tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy
          trivy --version

      - name: Run trivy vulnerability scan
        # P3-C-03 fix: CRITICAL findings block CI; HIGH still reported for
        # review. ignore-unfixed: only report findings with a fix available.
        # 2026-09-29 更正：本步骤此前注释为 "DB caching via actions/cache
        # keyed on the week"——那是 trivy-action 时期的方案；自 5d80ce2 改为
        # 直装 CLI 后，本 job 没有任何缓存步骤，trivy 每次运行自行拉取 DB
        # （全仓唯一的 actions/cache 是 e2e job 的 Playwright 浏览器缓存）。
        run: |
          trivy image --severity CRITICAL --ignore-unfixed \
            --format json --output trivy-report.json \
            --exit-code 1 --timeout 10m \
            maop:scan || code=$?
          if [ "${code:-0}" != "0" ] && [ "${code:-0}" != "1" ]; then
            echo "::error::trivy scan error (exit=$code)"
            exit "$code"
          fi
          if [ "${code:-0}" = "1" ]; then
            echo "::error::trivy found CRITICAL findings"
            exit 1
          fi
      - name: Trivy CRITICAL summary (on failure)
        # a308278: trivy exit-1 blocked CI but the finding list was only in
        # the (unfetchable) report — surface the CVE IDs as annotations so
        # triage (fix vs .trivy-ignore with justification) is possible via API.
        if: failure()
        run: python py/scripts/trivy_annotate.py trivy-report.json
      - name: Upload container scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-container-scan
          path: trivy-report.json
  # ── Publish to PyPI ─────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # 诚实化（2026-09-25）：不再依赖 perf-smoke（原 `performance` job，非负载
    # 门禁，不应阻塞 PyPI 发布）。发布由 test / frontend / e2e 把关。
    #
    # 2026-09-29 复核曾确认本 job **不可达**（`on.push` 只有 branches ⇒ tag push 被
    # 平台过滤，`if: ... refs/tags/v` 恒假），当时只留注释、没改行为。
    # 2026-10-06 打通触发面：`on.push.tags: ['v*']` 已补上，依赖链 scope→lint→test /
    # frontend / e2e 在 tag push 上都会真跑（tag push 拿不到 diff 基线，
    # ci_path_scope 按"空变更集 = 全量"的保守分支判 code=true，正是发布想要的）。
    # 守卫：py/tests/test_ci_publish_reachable.py（含反向对照）。
    #
    # 仍缺的**外部**前置（需 PyPI 账号，不能由本仓库完成）：
    #   在 PyPI 项目 `maop-orchestrator` 把本仓库登记为 trusted publisher
    #   （Owner=Levango7 / Repository=MAOP / Workflow=ci.yml）。
    # 未配置时第一条真 tag 会在 `Publish maop` 步骤 401/403 红 ——
    # 那是**该红就红**，不要再把它改成恒绿。
    needs: [test, frontend, e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Release integrity precheck
        run: python scripts/check_release_tag.py --ref "${{ github.ref }}"

      - name: Build packages
        run: |
          pip install build
          python -m build

      - name: Publish maop
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ── Compose Smoke Test（仅冒烟，非部署；真实部署能力待建，见 P1-3 方案 B）─────────────────────────────────────────
  compose-smoke:
    name: Compose Smoke
    runs-on: ubuntu-latest
    # 诚实化（2026-09-25）：不再依赖 perf-smoke（原 `performance` job，非负载
    # 门禁，不应阻塞 compose 冒烟）。冒烟由 test / frontend / e2e / docker 把关。
    needs: [test, frontend, e2e, docker]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Compose up (smoke)
        # 5d80ce2: every bash construct in this step (for/$(seq)/while-read
        # pipelines) never executed on the runner — zero annotations across
        # 3 rounds, same "1-second-death with no output" signature as the
        # old Windows e2e steps. The entire up+poll+diagnose flow now lives
        # in a single python invocation (scripts/compose_smoke.py): no bash
        # loops, no command substitution, cross-platform, locally testable.
        env:
          # F-P1-9 fix: provide required secrets/env for compose smoke test.
          # MAOP_JWT_SECRET must be >=32 chars (enforced by load_jwt_secret()).
          MAOP_JWT_SECRET: test-secret-at-least-32-chars-long
          MAOP_PG_PASSWORD: maop_dev
          MAOP_REDIS_PASSWORD: maop_dev
          MAOP_ENV: test
          MAOP_AUTH: "1"
          # ff244be: Docker Hub direct base images for the compose build
          # (aliyun mirrors are slow/unreachable from GitHub runners; the
          # compose build previously used the Dockerfile's aliyun defaults
          # with no override path).
          PYTHON_IMAGE: python:3.13-slim
          # 2026-09-29: 同 docker job，node:20 → node:24（jsdom@30 engines 区间）
          NODE_IMAGE: node:24-alpine
        run: python py/scripts/compose_smoke.py

      - name: Run smoke tests
        # 8a6f128: /api/info has no "version" field, and /api/versions is
        # admin-gated (401 for anonymous curl). The health payload itself
        # carries both status AND version — assert both from the one
        # public, healthcheck-approved endpoint.
        run: |
          BODY=$(curl -sf http://localhost:9079/api/health)
          echo "$BODY" | grep -q '"status"'
          echo "$BODY" | grep -q '"version"'
          echo "Compose smoke tests passed."

      - name: Notify on failure
        if: failure()
        run: echo "::warning::Compose smoke failed — check logs."

  # ── CI merge gate：把上游结论收敛成一条 name 稳定的 required check ─────────────
  # 为什么需要：矩阵作业 `pytest (...)` 在 docs-only 时上报的是**未展开的模板字面量名**，
  # push-only 作业在 PR 上恒为 skipped —— 两类都没法当 required 上下文用，于是"测试必须绿"
  # 只剩人看。本作业用 `if: always()` 保证任何 PR 上都会产出一条 `CI merge gate`，
  # 再把"跑失败 / 被取消 / 该跑却没跑"折进它的红绿里。判定逻辑在
  # py/scripts/ci_merge_gate.py，单测与结构守卫见 py/tests/test_ci_merge_gate.py。
  gate:
    name: CI merge gate
    needs: [scope, lint, test, frontend, e2e, migrations, audit, sast, sbom, perf-smoke, lock-drift]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Aggregate upstream job results
        working-directory: py
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CODE: ${{ needs.scope.outputs.code }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS_JSON" > /tmp/ci_needs.json
          python3 scripts/ci_merge_gate.py --needs-json /tmp/ci_needs.json --code "$CODE"
