# Nightly workflow for MAOP — full E2E + flaky detection + soak tests.
# P1 fix (2026-09-17): split from ci.yml to enable nightly-only heavy tests.
name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch: {}   # manual trigger

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false  # don't cancel nightly

permissions:
  contents: read

jobs:
  # ── Ubuntu 26.04 金丝雀（2026-10-04 加）─────────────────────────────
  # 官方 changelog（2026-09-17）：`ubuntu-latest` 将在 **2026-10-19 ~ 11-19**
  # 的窗口内迁到 Ubuntu 26.04；要留在旧版需显式钉 `ubuntu-24.04`，而
  # `ubuntu-26.04` 已 GA 可生产使用。
  #
  # 与其等主干在 10-19 那天被动换 OS（届时会同时影响 9 条 pytest 腿、容器构建与
  # Playwright），不如先在 nightly 上把差异量出来：这条腿**显式**用 26.04，跑与 CI
  # 同口径的 pytest。它红了只说明"我们还没准备好迁"，不堵任何 PR —— 这正是 nightly
  # 该干的事（对比：把 canary 挂在 PR 上并 continue-on-error，就又是一个"吞失败的门"，
  # 本仓明令禁止，见 py/tests/test_ci_workflow_hygiene.py）。
  #
  # 迁移完成（26.04 持续绿）后：把 ci.yml 的矩阵 os 换成 26.04（或显式 ubuntu-26.04）
  # 并删掉本作业；在那之前 ci.yml 保持 `ubuntu-latest`，走完 10-19 的窗口即为 26。
  ubuntu26-canary:
    name: Ubuntu 26.04 canary (py3.13)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install deps
        run: pip install -e ./py[dev] --quiet
      - name: Run unit tests (same command shape as ci.yml)
        # 口径对齐 ci.yml 的 Linux 腿：-n 2；但**不带 --reruns**（canary 要看真结果，
        # 重试只会把"这个 OS 上会挂"掩盖成绿）。排除 serial 标记那批 —— 它们需要
        # 串行，由各自的步骤负责。
        shell: bash
        env:
          MAOP_ENV: 'test'
        run: |
          python -m pytest py/tests/ -q --ignore=py/tests/contract             -m "not slow and not serial" --timeout=60 --reruns=0 -n 2             --junitxml=canary-ubuntu26.xml
      - name: Surface failing test ids
        if: failure()
        shell: bash
        run: |
          cd py && python scripts/junit_annotate.py ../canary-ubuntu26.xml || true

  # ── slow 标记集合（2026-10-06 加）───────────────────────────────────
  # 发现过程：核对"CI 跑了多少用例"时发现本机全量 collect 是 10339，而 CI 主腿只有
  # 8766 个结果。差额不是漏跑就是标记问题 —— 逐条查下来：ci.yml 的 unit / serial 两条腿
  # 都带 `-m "not slow …"`，perf-smoke 作业只对 `tests/performance/`（`-m slow`）和
  # `tests/reliability/ + tests/stability/`（无 -m）显式跑。于是**根级的 47 个 slow 用例**
  # （test_ldap_real_env.py 21、test_stress.py 14、test_k8s_operator.py 12）在任何一条腿里
  # 都不存在 —— 它们可以无声腐烂，而 CI 天天绿。
  # 本机实测（`-m slow` 全集合，串行、`--timeout=300`）：**57 passed / 22 skipped / 0 failed，
  # 2 分 44 秒**；其中上面那 47 条根级用例是 28 passed / 19 skipped / 约 90 秒
  # （skip 的那批需要真 LDAP 服务）。所以放到 nightly，不占 PR 时间，也不加 `|| true`
  # （本仓禁止吞失败的门禁，见 py/tests/test_ci_workflow_hygiene.py）。
  #
  # 覆盖面由 py/tests/test_nightly_flaky_coverage.py 的 TestSlowMarkerCoverage 机器核对：
  # 每个带 slow 标记的文件都必须被某条腿真跑到，否则那条守卫红。
  slow-suite:
    name: Slow-marker suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install deps
        run: pip install -e ./py[dev] --quiet
      - name: Run everything marked slow
        # `-n 0`：这批是压力/长运行/真实环境用例，并发跑会互相抢 CPU 与端口，
        # 症状是"只有夜里才红"的假 flaky。串行慢一点，但结论可信。
        # 不带 --reruns：同 flaky-detection 的理由 —— 重试会把真问题洗成绿。
        shell: bash
        env:
          MAOP_ENV: 'test'
        run: |
          python -m pytest py/tests/ -q -m slow --timeout=300 -n 0 --reruns=0 \
            --junitxml=slow-suite.xml
      - name: Surface failing test ids
        if: failure()
        shell: bash
        run: |
          cd py && python scripts/junit_annotate.py ../slow-suite.xml || true

  full-e2e:
    name: Full E2E (all browsers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard-enterprise/package-lock.json
      - name: Install Python deps
        run: pip install -e ./py[dev] --quiet
      - name: Install frontend deps
        run: npm ci
        working-directory: dashboard-enterprise
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: dashboard-enterprise
      - name: Run E2E (all browsers, no retries)
        run: npx playwright test --reporter=html
        working-directory: dashboard-enterprise
        env:
          MAOP_AUTH_ENABLED: '0'
          MAOP_ENV: 'test'
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-nightly
          path: dashboard-enterprise/playwright-report/

  soak-test:
    name: Soak Test (manual — CI does not run it)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Soak test is manual-only
        # 诚实化（2026-09-25）：此前本 job 跑 `pytest py/tests/soak/ -v`，但该目录
        # 只有 standalone 脚本 soak_test.py（无 test 函数）→ 实测
        # `no tests collected`、退出码 5，nightly 因此恒红。
        # 真实 soak 属 48h 级长跑（脚本默认 --duration 172800），且依赖 psutil
        # —— psutil 未在 pyproject / requirements.lock 中声明，CI 环境没有；
        # GitHub runner 也不适合长跑，故 CI 明确不执行（显式 exit 0），
        # 由人工在长跑环境执行：
        #   python py/tests/soak/soak_test.py --duration 172800   # 48h 完整
        #   python py/tests/soak/soak_test.py --duration 600      # 10min 冒烟
        # 退出码 0=PASS / 1=FAIL / 2=psutil 缺失；结果写在 deliverables/。
        run: |
          echo "soak-test is manual-only: CI does not run the 48h soak test."
          echo "Run it in a long-run environment (needs psutil, undeclared in pyproject):"
          echo "  python py/tests/soak/soak_test.py --duration 172800"
          echo "exit code: 0=PASS, 1=FAIL, 2=psutil missing"

  flaky-detection:
    name: Flaky Test Detection (${{ matrix.os }}, py${{ matrix.python-version }})
    # 覆盖面修正（2026-10-04）：原实现只在 ubuntu + 3.13 上串行跑 3 遍，而实测的
    # 两家凶（`TestCallSyncFallback`）出现在 **macos-latest/3.13** 与
    # **windows-latest/3.12** —— 它检测的平台与真出问题的平台不相交，等于守不住
    # 它声称守的东西。现在按"历史上真出过问题的腿"组矩阵，并复刻 CI 的真实并发
    # 配置（见 ci.yml「Run unit tests」）：
    #   - Linux/macOS: xdist 并行（CI 用 -n 2）
    #   - Windows: 串行（CI 用 -n 0 —— xdist 3.8.0 在 Windows 有 execnet worker 竞态）
    # 每轮都带 --reruns=0：CI 的 --reruns=3 会把 flaky 重试成绿，只有这里去掉重试
    # 才看得见"时好时坏"。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.13'
            repeats: 3
            xdist: '-n 2'
          - os: macos-latest
            python-version: '3.13'
            repeats: 3
            xdist: '-n 2'
          - os: windows-latest
            python-version: '3.12'
            repeats: 2
            xdist: '-n 0'
    runs-on: ${{ matrix.os }}
    # 超时按实测定（run 477 的同一套 CI 腿）：ubuntu 6min / macos 3min /
    # windows-3.12 14min —— 且那是**含** --reruns=3 的耗时。最慢腿 windows 跑 2 遍
    # 约 28min，60min 给约 2 倍余量；矩阵并行，总墙钟由最慢腿决定。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: pip install -e ./py[dev] --quiet
      - name: Run tests ${{ matrix.repeats }}x to detect flaky
        # 检测目标：同一套测试连跑 N 次，暴露「时好时坏」的不稳定测试。
        # 诚实化（2026-09-25）：此前循环内每条 pytest 都带 `|| true`，job 恒绿、
        # 永远发现不了任何问题；现在去掉 `|| true`，累计失败次数，任意一次失败即
        # job 失败（失败 run 的用例 ID 见日志）。
        shell: bash
        env:
          MAOP_ENV: 'test'
        run: |
          fails=0
          for i in $(seq 1 ${{ matrix.repeats }}); do
            echo "=== Run $i (xdist: ${{ matrix.xdist }}) ==="
            if python -m pytest py/tests/ -q --ignore=py/tests/contract \
                 -m "not slow and not serial" --timeout=60 --reruns=0 \
                 ${{ matrix.xdist }}; then
              echo "run $i: PASS"
            else
              echo "::error::flaky-detection run $i FAILED (${{ matrix.os }}, py${{ matrix.python-version }})"
              fails=$((fails + 1))
            fi
          done
          echo "failed runs: $fails/${{ matrix.repeats }}"
          if [ "$fails" -ne 0 ]; then
            echo "::error::$fails of ${{ matrix.repeats }} runs failed on ${{ matrix.os }} — treat as flaky/unstable"
            exit 1
          fi
      - name: Run serial-marker tests once (no retries)
        # ci.yml 把 `not slow and not serial` 与 `not slow and serial` 分成两步跑；
        # 本作业原先只跑了前者，**serial 那一族**（共享全局状态 / 固定端口）从没在
        # 无重试条件下被观察过 —— 而它们恰恰是最容易 flaky 的一批。
        shell: bash
        env:
          MAOP_ENV: 'test'
        run: |
          python -m pytest py/tests/ -q --ignore=py/tests/contract \
            -m "not slow and serial" -n 0 --timeout=60 --reruns=0

  # ── required checks 漂移对账（§7.6）────────────────────────────────
  # 仓库内守卫（test_ci_required_checks.py）只核对清单 / ci.yml / 文档三方，全在仓库里；
  # GitHub 分支保护是**带外配置**，任何仓库内改动都看不见它。2026-10-01 实测的漂移正是
  # 三方一致写着 4 条（含 `CI merge gate`）、GitHub 上却是旧的 5 条 —— 聚合作业建好了
  # 却从未生效，9 平台 pytest / e2e / 迁移 / 审计全无平台级强制。本作业补上第四处。
  #
  # 为什么放 nightly 而不是 PR 腿：读分支保护要 admin 作用域，默认 GITHUB_TOKEN 没有
  # （必然 403）。夜间用 PAT（secret REQUIRED_CHECKS_TOKEN，read:repo 即可）真对账；
  # 未配置该 secret 时**显式说明并跳过**，不假装通过 —— 恒绿的门禁比没有门禁更坏。
  required-checks-drift:
    name: Required checks drift (manifest vs GitHub)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check for a token that can read branch protection
        id: tok
        env:
          PAT: ${{ secrets.REQUIRED_CHECKS_TOKEN }}
        run: |
          if [ -n "$PAT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare manifest against live branch protection
        if: steps.tok.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.REQUIRED_CHECKS_TOKEN }}
        run: |
          python py/scripts/check_required_checks_drift.py

      - name: Explain why this was skipped
        if: steps.tok.outputs.present != 'true'
        run: |
          echo "::warning title=Required checks drift::未配置 secret REQUIRED_CHECKS_TOKEN"
          echo "本次**没有**对账 —— 分支保护是带外配置，仓库内守卫看不见它。"
          echo "启用方式：建一个 PAT（read:repo 即可）存为仓库 secret REQUIRED_CHECKS_TOKEN。"
          echo "在此之前，required 上下文的实际状态可人工核对："
          gh api "repos/${{ github.repository }}/branches/master/protection" \
            --jq '.required_status_checks.contexts' || true

