agents:
  MAOP:
    capabilities:
    - codegen
    - chat
    - planning
    - search
    - review
    - explain
    - orchestrate
    - verify
    - memory
    - mcp
    - pipeline
    - vision
    - multimodal
    category: general
    cli: python
    cli_args: -m maop.cli run --task "{task}"
    description: MAOP self-referential agent — can delegate to itself (max_self_ref_depth=3)
    driver: cli
    extracts_queries: true
    model: auto
    results_merge: true
    subagents:
      self:
        capabilities:
        - codegen
        - chat
        - planning
        - orchestrate
        - vision
        - multimodal
        cli_args: -m maop.cli run --task "{task}" --depth {depth}
        description: MAOP self-delegation subagent
    supports_regeneration: true
    timeout_s: 180
  autoclaw:
    capabilities:
    - codegen
    - chat
    - quickfix
    category: specialized
    cli: autoclaw -n -y
    cli_args: chat {task}
    description: Autoclaw v0.1.6 headless (verified, ~3.2s)
    driver: cli
    model: built-in
    timeout_s: 30
  cline:
    capabilities:
    - codegen
    - refactor
    - explain
    - search
    - review
    - fileops
    category: general
    cli: cline
    cli_args: '{task}'
    description: Cline CLI v3.0.75 (headless, English prompt)
    driver: cli
    model: auto
    timeout_s: 600
    # T2.1: instruction-based dry-run (agentic CLI). Declaration
    # = eligible for the preamble; the verify gate arbitrates.
    dry_run_supported: true

  cloudbase:
    capabilities:
    - deploy
    - cloudops
    - fileops
    category: specialized
    cli: cloudbase
    cli_args: '{task}'
    description: CloudBase CLI v3.6.3 (腾讯云, ~2.6s)
    driver: cli
    model: auto
    timeout_s: 120
    # T2.1: instruction-based dry-run (agentic CLI). Declaration
    # = eligible for the preamble; the verify gate arbitrates.
    dry_run_supported: true

  codebuddy:
    capabilities:
    - codegen
    - quickfix
    - explain
    - chat
    category: specialized
    cli: codebuddy
    cli_args: -p --model hy4flash-free '{task}'
    description: CodeBuddy CLI v2.187.0 (腾讯, hy4flash-free 免费模型实测可用, headless -p)
    driver: cli
    model: auto
    timeout_s: 600
  codewhale:
    capabilities:
    - codegen
    - fileops
    - quickfix
    category: specialized
    cli: codewhale
    cli_args: '{task}'
    description: Codewhale v0.9.0 (auth may be broken in v0.8.65)
    driver: cli
    model: native
    timeout_s: 60
    # T2.1: instruction-based dry-run (agentic CLI). Declaration
    # = eligible for the preamble; the verify gate arbitrates.
    dry_run_supported: true

  crush:
    capabilities:
    - codegen
    - chat
    - explain
    - search
    category: specialized
    cli: crush
    cli_args: run '{task}'
    description: Crush v0.86.0 (Charmbracelet terminal AI, ~1.8s)
    driver: cli
    model: auto
    timeout_s: 120

  doc-pipeline:
    capabilities:
    - docgen
    - pipeline
    - techdoc
    - research
    - verify
    category: platform
    cli: python
    cli_args: -c "from maop.delegate.doc_pipeline_adapter import run_pipeline; import
      json,sys; r=run_pipeline(pipeline_name=sys.argv[1], input_file=sys.argv[2]);
      print(json.dumps(r))" "{pipeline_name}" "{input_file}"
    description: doc-pipeline workflow adapter (DAG + quality gate + circuit breaker
      + event hooks)
    driver: python
    model: n/a
    routing_key: pipeline
    timeout_s: 600
    # T2.1: in-repo adapter — dry_run reaches it via MAOP_DRY_RUN env
    # and performs a real rehearsal (orch.plan(), no execution).
    dry_run_supported: true
  forge:
    capabilities:
    - codegen
    - quickfix
    - explain
    category: specialized
    cli: forge
    cli_args: '{task}'
    description: Forge v2.13.18 (ForgeCode, ~1.7s)
    driver: cli
    model: auto
    timeout_s: 120
  kilo:
    capabilities:
    - codegen
    - search
    - review
    - explain
    category: general
    cli: kilo
    cli_args: run '{task}'
    description: Kilo CLI v7.8.32 (OpenCode, reflection/beam-free)
    driver: cli
    model: auto
    timeout_s: 600
  lh:
    capabilities:
    - codegen
    - chat
    - explain
    - search
    category: specialized
    cli: lh
    cli_args: '{task}'
    description: LobeHub CLI v0.0.45 (~0.8s)
    driver: cli
    model: auto
    timeout_s: 120
  nanobot:
    capabilities:
    - chat
    - search
    - explain
    category: specialized
    cli: nanobot
    cli_args: agent -m "{task}"
    description: nanobot v0.2.2 (requires API key in ~/.nanobot/config.json)
    driver: cli
    model: auto
    timeout_s: 60
  omniroute:
    capabilities:
    - codegen
    - refactor
    - explain
    - review
    - planning
    - search
    - reasoning
    - tool_use
    category: platform
    cli: ''
    description: OmniRoute local gateway - 160+ providers with auto failover
    driver: cli
    enabled: true
    extracts_queries: false
    model: omniroute-auto-coding
    provider: omniroute
    results_merge: false
    supports_regeneration: false
    timeout_s: 120
  opencode:
    capabilities:
    - codegen
    - chat
    - explain
    - search
    - fileops
    category: general
    cli: opencode
    cli_args: run '{task}'
    description: OpenCode CLI v2.4.2 (seaglass-alpha-free 实测 2026-11-27, headless run)
    driver: cli
    model: auto
    timeout_s: 600
  pi:
    capabilities:
    - codegen
    - chat
    - quickfix
    - explain
    category: specialized
    cli: pi
    cli_args: '-p "{task}"'
    description: Pi CLI v1.7.0 (Earendil Works, 实测 2026-11-27 headless -p 可用)
    driver: cli
    model: auto
    timeout_s: 600
  qwenpaw:
    capabilities:
    - codegen
    - search
    - fileops
    - planning
    - review
    - explain
    - chat
    category: general
    cli: qwenpaw
    cli_args: '{task}'
    description: QwenPaw v2.0.1b1 (AgentScope framework, ~1.6s)
    driver: cli
    model: deepseek-v4-flash-free
    timeout_s: 120
loops:
  iterative:
    backoff_ms: 2000
    max_attempts: 3
    stop_on_success: true
  routing:
    enabled: true
routing:
  chat:
    fallback: omniroute
    keywords:
    - 聊天
    - 对话
    - 问答
    - 闲聊
    - chat
    - 一般问题
    - 随意
    - 你好
    - 打招呼
    - 问候
    - hi
    - hello
    - hey
    - 在吗
    - 介绍一下
    primary: mmx
    tertiary: copilot
  codegen:
    fallback: omniroute
    keywords:
    - 编写
    - 写代码
    - 生成
    - 开发
    - implement
    - coding
    - 功能
    - feature
    - 实现
    - 写个
    - 写一个
    - 写段
    - 实现一个
    - 实现段
    - 代码
    - 程序
    - 算法
    - sort
    - bubble
    - quicksort
    - 排序
    - 函数
    - 类
    - 模块
    - 项目
    primary: mmx
    tertiary: copilot
  docgen:
    fallback: omniroute
    keywords:
    - 生成文档
    - 文档
    - document
    - 注释
    - 说明
    - 文档生成
    - readme
    - api文档
    match: (?:document|doc|readme|guide|comment)
    primary: doc-pipeline
    tertiary: copilot
  fileops:
    fallback: cline
    keywords:
    - 文件操作
    - 创建文件
    - 删除文件
    - 移动文件
    - 读写文件
    - file operations
    - read file
    - write file
    - 复制
    primary: qwenpaw
  mcp:
    fallback: copilot
    keywords:
    - mcp
    - 工具调用
    - 外部工具
    - MCP
    - tool call
    - function call
    primary: hermes
  memory:
    fallback: cline
    keywords:
    - 记忆
    - 记住
    - 存储
    - memory
    - remember
    - 历史
    - 上下文
    primary: MAOP
  multimodal:
    fallback: crush
    keywords:
    - 多模态
    - multimodal
    - 图文
    - 音视频
    - 混合输入
    primary: MAOP
    tertiary: MAOP
  orchestrate:
    fallback: MAOP
    keywords:
    - orchestrate
    - 编排
    - 协调
    - multi-agent
    - 多agent
    - compose
    - 调度
    match: (?:orchestrat|编排|协调|compose|调度)
    primary: MAOP
    tertiary: copilot
  pipeline:
    fallback: MAOP
    keywords:
    - 流水线
    - pipeline
    - 工作流
    - workflow
    - 自动化流程
    - ci/cd
    - 持续集成
    primary: doc-pipeline
    tertiary: MAOP
  planning:
    fallback: omniroute
    keywords:
    - 规划
    - 计划
    - 方案
    - 架构
    - plan
    - design
    - 设计
    - blueprint
    - 策略
    - strategy
    match: (?:plan|architect|design|blueprint|strategy)
    primary: kimi
    tertiary: copilot
  quickfix:
    fallback: omniroute
    keywords:
    - 修复
    - fix
    - bug
    - 错误
    - 紧急
    - quick fix
    - hotfix
    - 补丁
    - patch
    - 问题
    match: (?:fix|bug|error|hotfix|patch|quick\s*fix)
    primary: cursor
    tertiary: autoclaw
  refactor:
    fallback: omniroute
    keywords:
    - 重构
    - 重写
    - rewrite
    - restructure
    - 清理
    - clean up
    - 优化结构
    match: (?:refactor|rewrite|restructure|clean\s+up)
    primary: cline
    tertiary: kimi
  review:
    fallback: omniroute
    keywords:
    - 审查
    - 审核
    - review
    - code review
    - 评审
    - 检查代码
    primary: kimi
    tertiary: copilot
  search:
    fallback: codex
    keywords:
    - 搜索
    - 检索
    - 查
    - 查找
    - find
    - 调研
    - research
    - 查询
    - look up
    - 资料
    primary: kimi
    tertiary: hermes
  techdoc:
    fallback: omniroute
    keywords:
    - 技术文档
    - 规范
    - specification
    - 接口文档
    - API文档
    - tech doc
    - 架构文档
    - 白皮书
    primary: doc-pipeline
    tertiary: copilot
  verify:
    fallback: omniroute
    keywords:
    - 验证
    - verify
    - 测试
    - test
    - 单元测试
    - 集成测试
    - assert
    - 断言
    match: (?:verify|test|assert|spec|unit\s+test|integration)
    primary: kimi
    tertiary: kimi
  vision:
    fallback: crush
    keywords:
    - 图片
    - 图像
    - 视觉
    - image
    - vision
    - 截图
    - screenshot
    - 识别
    primary: MAOP
    tertiary: MAOP
workflows:
  doc-pipeline:
    capabilities:
    - docgen
    - techdoc
    - pipeline
    cli: python -m maop.cli run --task "{task}" --mode pipeline
    description: 'Doc-Pipeline workflow: Planner→Retriever→Checker→Writer→Formatter
      (11 steps, checkpoint/resume).'
    driver: cli
    model: auto
    model_display: 'Doc-Pipeline v2 (Python workflow: 5 agents, 11 steps)'
    timeout_s: 300
  # M-X2 E2-a 验收样例（Temporal 后端 demo；3 节点 DAG，分支并行）——
  # 前置依赖见 scripts/temporal_m0_demo.py 配方（temporalio + dev server）。
  m0-demo:
    description: 'M-X2 M0 acceptance DAG: planner -> (worker-a || worker-b).'
    steps:
    - agent: codex
      task: '节点 0（规划）：拆解任务并产出两路分支'
      timeout_s: 120
    - agent: codex
      task: '节点 1（分支 A）：输出冒烟结论'
      depends_on: ['0']
      timeout_s: 120
    - agent: codex
      task: '节点 2（分支 B）：输出验收清单'
      depends_on: ['0']
      timeout_s: 120
