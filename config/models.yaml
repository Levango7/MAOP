# ── Policies ──────────────────────────────────────────────────
policies:
  # Default selection policy
  default:
    strategy: best_quality_within_budget  # cheapest | fastest | best_quality | best_quality_within_budget
    max_cost_per_task: 0.05  # USD
    prefer_low_latency: false
    fallback_on_error: true
    fallback_on_timeout: true
    fallback_on_quota_exceeded: true

  # Code generation policy
  codegen:
    strategy: best_quality
    max_cost_per_task: 0.10
    prefer_low_latency: false
    fallback_on_error: true
    fallback_on_timeout: true

  # Quick fix policy
  quickfix:
    strategy: fastest
    max_cost_per_task: 0.02
    prefer_low_latency: true
    fallback_on_error: true

  # Chat policy
  chat:
    strategy: cheapest
    max_cost_per_task: 0.01
    prefer_low_latency: true
    fallback_on_error: true

# ── Budget ─────────────────────────────────────────────────────
budget:
  daily_limit: 5.0  # USD
  monthly_limit: 100.0  # USD
  alert_threshold: 0.8  # alert at 80% of daily limit
  hard_stop: true  # stop dispatching when limit hit

# ── Quota ──────────────────────────────────────────────────────
quota:
  # Per-provider rate limits
  stepfun:
    requests_per_minute: 60
    tokens_per_minute: 100000
  minimax:
    requests_per_minute: 30
    tokens_per_minute: 50000
  agnesai:
    requests_per_minute: 20
    tokens_per_minute: 20000
  aliyun:
    requests_per_minute: 60
    tokens_per_minute: 100000
  opencode:
    requests_per_minute: 10
    tokens_per_minute: 10000
