# MAOP Model Registry — Authoritative model & provider configuration
# This file is the single source of truth for all model definitions.
# agents.yaml references models by name; this file defines what each model is.
#
# Protocol types:
#   openai_responses   — OpenAI Responses API (/v1/responses)
#   openai_completions — OpenAI Chat Completions API (/v1/chat/completions)
#   claude_code        — Anthropic Claude Code protocol
#   custom             — Provider-specific protocol
#
# Thinking mode levels:
#   low    — ~512 reasoning tokens, +10-20% latency. Simple tasks.
#   medium — ~3072 reasoning tokens, +30-50% latency. Planning, review.
#   high   — ~12288 reasoning tokens, +100-200% latency. Architecture, deep debug.

# ── Default LLM exit (Phase 2) ────────────────────────────────
# When set, ModelSelector prefers models from this provider as primary.
# Other providers are used as fallback. Set to "" to disable.
default_provider: omniroute

# Default model of last resort: used when no model is specified and
# all else fails. Set to "" to disable.
default_model: omniroute-auto-coding

# ── Providers ──────────────────────────────────────────────────
providers:
  stepfun:
    type: openai-compatible
    protocol: openai_completions
    base_url: "https://api.stepfun.com/v1"
    api_key_env: STEPFUN_API_KEY
    timeout_s: 120
    max_retries: 3
    health_check_url: "https://api.stepfun.com/v1/models"
    enabled: true

  minimax:
    type: openai-compatible
    protocol: openai_completions
    base_url: "https://api.minimax.chat/v1"
    api_key_env: MINIMAX_API_KEY
    timeout_s: 120
    max_retries: 3
    enabled: true

  agnesai:
    type: custom
    protocol: openai_completions
    base_url: "https://api.agnes.ai/v1"
    api_key_env: AGNES_API_KEY
    timeout_s: 30
    max_retries: 2
    enabled: true

  opencode:
    type: openai-compatible
    protocol: openai_completions
    base_url: "https://api.opencode.ai/v1"
    api_key_env: OPENCODE_API_KEY
    timeout_s: 60
    max_retries: 2
    enabled: true

  aliyun:
    type: openai-compatible
    protocol: openai_completions
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_env: DASHSCOPE_API_KEY
    timeout_s: 120
    max_retries: 3
    enabled: true

  local:
    type: builtin
    protocol: custom
    base_url: ""
    api_key_env: ""
    timeout_s: 60
    max_retries: 1
    enabled: true

  openrouter:
    type: openai-compatible
    protocol: openai_completions
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 120
    max_retries: 3
    enabled: false

  # ── Anthropic Claude (example for claude_code protocol) ──
  anthropic:
    type: custom
    protocol: claude_code
    base_url: "https://api.anthropic.com/v1"
    api_key_env: ANTHROPIC_API_KEY
    timeout_s: 120
    max_retries: 3
    health_check_url: "https://api.anthropic.com/v1/models"
    enabled: false
    extra_headers:
      anthropic-version: "2024-01-01"

  # ── Ollama (local models) ──
  ollama:
    type: ollama
    protocol: ollama_chat
    base_url: "http://localhost:11434"
    api_key_env: ""
    timeout_s: 300
    max_retries: 1
    health_check_url: "http://localhost:11434/api/tags"
    enabled: false

  # ── OmniRoute (local AI gateway) ──
  omniroute:
    type: openai-compatible
    protocol: openai_completions
    base_url: "http://localhost:20128/v1"
    api_key_env: OMNIROUTE_API_KEY
    api_key: "dummy"  # local service, no real key needed; OpenAI client requires non-empty
    timeout_s: 120
    max_retries: 3
    health_check_url: "http://localhost:20128/v1/models"
    enabled: true
    description: "OmniRoute local AI gateway - 160+ providers, auto failover, MCP/A2A"

