providers:
  # === 直连供应商（现有，保持不变）===
  agnes:
    base_url: https://api.agnes-ai.cn/v1
    api_key_env: AGNES_API_KEY
  stepfun:
    base_url: https://api.stepfun.com/v1
    api_key_env: STEPFUN_API_KEY
  minimax:
    base_url: https://api.minimax.chat/v1
    api_key_env: MINIMAX_API_KEY
  local:
    type: builtin
  testprov:
    api_key_env: TEST_KEY

  # === 第三方中转平台（新增）===
  openrouter:
    type: relay
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    display_name: "OpenRouter"
    description: "统一API网关，100+模型，按token计费"
    features: [model_discovery, price_comparison, free_tier, streaming]
    rate_limit_rpm: 100
    region: international

  siliconflow:
    type: relay
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY
    display_name: "硅基流动"
    description: "国产中转平台，价格便宜，支持国产模型"
    features: [model_discovery, price_comparison, free_tier, streaming]
    rate_limit_rpm: 200
    region: domestic

  nvidia:
    type: relay
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    display_name: "NVIDIA NIM"
    description: "GPU加速推理，适合大模型"
    features: [model_discovery, gpu_acceleration, streaming]
    rate_limit_rpm: 60
    region: international

  opencode-go:
    type: relay
    base_url: https://api.opencode-go.com/v1
    api_key_env: OPENCODE_GO_API_KEY
    display_name: "OpenCode Go"
    description: "代码生成中转平台"
    features: [model_discovery, price_comparison, streaming]
    rate_limit_rpm: 100
    region: international

  command-go:
    type: relay
    base_url: https://api.command-go.com/v1
    api_key_env: COMMAND_GO_API_KEY
    display_name: "Command Go"
    description: "命令行中转平台"
    features: [model_discovery, streaming]
    rate_limit_rpm: 100
    region: international

  zenmux:
    type: relay
    base_url: https://api.zenmux.com/v1
    api_key_env: ZENMUX_API_KEY
    display_name: "ZenMuX"
    description: "多模型中转平台"
    features: [model_discovery, price_comparison, streaming]
    rate_limit_rpm: 100
    region: international
models:
  agnes-2.5-pro:
    model_id: agnes-2.5-pro
    provider: agnes
    family: agnes
    cost_per_1k_input: 0.01
    cost_per_1k_output: 0.03
    capabilities:
    - codegen
    - chat
    - analysis
    latency_tier: fast
    quality_tier: excellent
  yi-large:
    model_id: yi-large
    provider: stepfun
    family: yi
    cost_per_1k_input: 0.02
    cost_per_1k_output: 0.06
    capabilities:
    - codegen
    latency_tier: fast
    quality_tier: excellent
  step-3.7-flash:
    model_id: step-3.7-flash
    provider: stepfun
    family: step
    cost_per_1k_input: 0.001
    cost_per_1k_output: 0.002
    capabilities:
    - codegen
    latency_tier: fast
  # ── 批 6：全量声明集官网列表价补录（2026-11-09）──
  # 口径：官网列表价（USD/1M ÷ 1000 = USD/1K），逐条钉 source URL + fetched_at。
  # 查无官方来源的声明型号按审计条 3「不可臆造」登记未核、不入表：minimax-m2.7
  # （官方价目表已下架，M2.x 退役）、mimo-v2.5（官方公告 2026-10-21 下线、旧名
  # 失效）、deepseek-v4-flash-free（第三方免 Key 渠道别名，非 DeepSeek 官方
  # SKU）、omniroute-auto-coding（网关路由别名，无单一列表价）。
  MiniMax-M3:
    model_id: MiniMax-M3
    provider: minimax
    family: minimax
    # 国际站按量页 Standard ≤512K 档现价（刊例 $0.60/$2.40 永久五折）；
    # >512K 档 $0.60/$2.40 与 Priority 1.5x 档未收录（单值取基础档）。
    # source: https://platform.minimax.io/docs/guides/pricing-paygo (fetched_at 2026-11-09)
    # 国内站同口径：刊例 ¥4.20/¥16.80，五折现价 ¥2.10/¥8.40
    # source: https://platform.minimax.cn/docs/guides/pricing (fetched_at 2026-11-09)
    cost_per_1k_input: 0.0003
    cost_per_1k_output: 0.0012
  qwen3.5-plus:
    model_id: qwen3.5-plus
    provider: stepfun
    family: qwen
    # 阿里云百炼国际站官方价目（agents.yaml codex 注明 StepFun proxy 路由）。
    # ≤256K 档非思考/思考同价 $0.40/$2.40；256K-1M 档 $0.50/$3.00 未收录。
    # source: https://www.alibabacloud.com/help/zh/model-studio/model-pricing (fetched_at 2026-11-09)
    cost_per_1k_input: 0.0004
    cost_per_1k_output: 0.0024
  gpt-5.4:
    model_id: gpt-5.4
    provider: openai
    family: openai
    # 官网标准处理价（<270K 上下文）：$2.50/$15.00，缓存输入 $0.25。
    # copilot CLI 自带模型，无对应 ProviderConfig；provider 仅作来源标注。
    # source: https://openai.com/api/pricing/ (fetched_at 2026-11-09; 直连 403，经官方页索引快照钉值)
    cost_per_1k_input: 0.0025
    cost_per_1k_output: 0.015
policies:
  default: {}
  codegen:
    strategy: best_quality
budget: {}
quota:
  stepfun: {}
  minimax:
    requests_per_minute: 30
