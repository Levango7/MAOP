# MAOP Alembic Configuration
#
# Active configuration for Alembic-managed migrations.
# The sqlalchemy.url below is overridden by env.py (MAOP_DB_URL env var or
# default sqlite:///<root>/data/maop.db).
#
# Usage:
#   pip install alembic
#   cd <project root>
#   alembic upgrade head
#
# This SQL runner (py/maop/core/migrations.py) and Alembic coexist (dual-track).

[alembic]
script_location = py/maop/migrations/alembic
sqlalchemy.url = sqlite:///data/maop.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S