# MAOP Alembic Configuration
#
# Active configuration for Alembic-managed migrations.
# The sqlalchemy.url below is overridden by env.py (MAOP_DB_URL env var or
# default sqlite:///<root>/data/maop.db).
#
# Usage:
#   pip install alembic
#   cd <project root>
#   alembic upgrade head
#
# This SQL runner (py/maop/core/migrations.py) and Alembic coexist (dual-track).

[alembic]
# 3f335fb: %(here)s = directory of this ini file. Resolves correctly from
# the repo root (here = repo root → py/maop/migrations/alembic) AND inside
# the container (ini at /app → /app/py/maop/migrations/alembic, which the
# Dockerfile now COPYs at the same repo-relative path). The previous bare
# relative path resolved against the CWD, breaking the container entrypoint.
script_location = %(here)s/py/maop/migrations/alembic
sqlalchemy.url = sqlite:///data/maop.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S