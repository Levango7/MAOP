# MAOP Nginx Reverse Proxy — TLS Termination
# Usage: docker compose --profile tls up -d

worker_processes auto;

events {
    worker_connections 10240;
}

http {
    upstream maop_dashboard {
        server dashboard:9079;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # P2-N-01 fix: gzip compression for API JSON responses and static assets.
    # Reduces bandwidth consumption and frontend load latency.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    # Redirect HTTP -> HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers (T2-8: removed deprecated X-XSS-Protection, added CSP/Referrer-Policy/Permissions-Policy)
        server_tokens off;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # CSP is set by the application middleware (CSPMiddleware)
        # Do not set CSP here to avoid dual-header conflicts
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # Static assets (Vite build)
        # P2-N-02 fix: nginx `add_header` in a location block overrides ALL parent
        # add_header directives. Previously only Cache-Control was set here, which
        # silently dropped every security header (X-Frame-Options, HSTS, etc.) for
        # /assets/ responses. Now all security headers are repeated explicitly,
        # matching nginx.prod.conf's /assets/ block.
        location /assets/ {
            proxy_pass http://maop_dashboard;
            expires 7d;
            add_header Cache-Control "public, immutable" always;
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            # CSP is set by the application middleware (CSPMiddleware)
            # Do not set CSP here to avoid dual-header conflicts
        }

        # API endpoints
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://maop_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # P3-N-03 fix: explicit connect timeout (default 60s too long for
            # slow backend startup — users see 502 after 60s instead of 5s).
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }

        # WebSocket
        location /ws {
            proxy_pass http://maop_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
        }

        # Everything else
        location / {
            proxy_pass http://maop_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
        }

        # Health check passthrough
        location /api/health {
            proxy_pass http://maop_dashboard;
            access_log off;
        }
    }
}
