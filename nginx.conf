# MAOP Nginx Reverse Proxy — TLS Termination
# Usage: docker compose --profile tls up -d

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream maop_dashboard {
        server dashboard:9079;
    }

    # 限制请求体大小为 10m，防止大文件上传攻击（P3-10 安全加固）
    client_max_body_size 10m;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Redirect HTTP -> HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Session resumption: avoids full TLS handshake on repeat connections
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_ciphers HIGH:!aNULL:!MD5;
        # Custom DH parameters for stronger key exchange (Logjam protection).
        # Generate with: openssl dhparam -out /etc/nginx/dhparam.pem 2048
        ssl_dhparam /etc/nginx/dhparam.pem;
        ssl_prefer_server_ciphers on;

        # OCSP Stapling: faster & more private TLS handshakes
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # gzip compression for API JSON responses and static text assets
        gzip on;
        gzip_types application/json text/plain text/css application/javascript;
        gzip_min_length 1000;
        gzip_proxied any;

        # Security headers (T2-8: removed deprecated X-XSS-Protection, added CSP/Referrer-Policy/Permissions-Policy)
        server_tokens off;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # CSP is set by the application middleware (CSPMiddleware)
        # Do not set CSP here to avoid dual-header conflicts
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # Static assets (Vite build)
        location /assets/ {
            proxy_pass http://maop_dashboard;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # API endpoints
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://maop_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # WebSocket
        location /ws {
            proxy_pass http://maop_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Everything else
        location / {
            proxy_pass http://maop_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check passthrough
        location /api/health {
            proxy_pass http://maop_dashboard;
            access_log off;
        }
    }
}
