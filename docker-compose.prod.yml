# MAOP Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Features:
#   - Resource limits
#   - Health checks
#   - Restart policy
#   - Volume persistence
#   - Prometheus + Grafana monitoring
#   - Nginx reverse proxy with TLS

version: "3.9"

services:
  # ── PostgreSQL (production) ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maop
      POSTGRES_USER: maop
      POSTGRES_PASSWORD: ${MAOP_PG_PASSWORD:?Set MAOP_PG_PASSWORD in .env for production}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maop -d maop"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - maop-net

  # ── HashiCorp Vault (production secrets backend) ────────────────
  vault:
    image: hashicorp/vault:latest
    environment:
      VAULT_LOCAL_CONFIG: |
        storage "file" { path = "/vault/data" }
        listener "tcp" { address = "0.0.0.0:8200"; tls_disable = 1 }
        api_addr = "http://vault:8200"
    volumes:
      - vault-data:/vault/data
      - vault-logs:/vault/logs
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    restart: unless-stopped
    networks:
      - maop-net

  # ── Redis (cache/queue/HA) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${MAOP_REDIS_PASSWORD:?Set MAOP_REDIS_PASSWORD in .env for production}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - maop-net

  maop:
    build:
      context: .
      dockerfile: py/Dockerfile
    container_name: maop-app
    restart: unless-stopped
    ports:
      - "${MAOP_PORT:-9079}:9079"
    environment:
      - MAOP_ENV=production
      - MAOP_ROOT=/app
      - MAOP_AUTH=${MAOP_AUTH:-1}
      - MAOP_JWT_SECRET=${MAOP_JWT_SECRET:?Set MAOP_JWT_SECRET in .env}
      - MAOP_TLS=${MAOP_TLS:-0}
      - MAOP_JSON_LOG=1
      - MAOP_OTEL_ENABLED=${MAOP_OTEL_ENABLED:-0}
      - MAOP_STORAGE_BACKEND=postgresql
      - MAOP_PG_HOST=postgres
      - MAOP_PG_DATABASE=maop
      - MAOP_PG_USER=maop
      - MAOP_PG_PASSWORD=${MAOP_PG_PASSWORD:?Set MAOP_PG_PASSWORD in .env for production}
      - MAOP_SECRET_BACKEND=vault
      - MAOP_VAULT_ADDR=http://vault:8200
      - MAOP_VAULT_TOKEN=${MAOP_VAULT_TOKEN:?Set MAOP_VAULT_TOKEN in .env for production}
      - MAOP_CACHE_BACKEND=redis
      - MAOP_QUEUE_BACKEND=redis
      - MAOP_HA_BACKEND=redis
      - MAOP_REDIS_HOST=redis
      - MAOP_REDIS_PASSWORD=${MAOP_REDIS_PASSWORD:-}
    volumes:
      - maop-data:/app/data
      - maop-config:/app/config
      - maop-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9079/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prometheus:
        condition: service_started
      vault:
        condition: service_started
    networks:
      - maop-net

  nginx:
    image: nginx:alpine
    container_name: maop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - nginx-certs:/etc/nginx/certs
    depends_on:
      - maop
    networks:
      - maop-net

  prometheus:
    image: prom/prometheus:latest
    container_name: maop-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    networks:
      - maop-net

  grafana:
    image: grafana/grafana:latest
    container_name: maop-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env for production}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - maop-net

volumes:
  maop-data:
  maop-config:
  maop-logs:
  nginx-certs:
  prometheus-data:
  grafana-data:
  pg-data:
  redis-data:
  vault-data:
  vault-logs:

networks:
  maop-net:
    driver: bridge