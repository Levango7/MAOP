# ─────────────────────────────────────────────────────────────────────
# MAOP Production Compose Override
#
# This file is NOT a standalone deployment. It overrides/extends
# docker-compose.yml for production use. Deploy with:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Single source of truth: docker-compose.yml (base services + dev defaults)
# Production overrides: this file (security hardening, persistence, profiles)
#
# See H-1 in audit report for rationale.
# ─────────────────────────────────────────────────────────────────────

# OPS-20 fix: single source of truth for container log rotation. Without an
# explicit logging driver, Docker defaults to json-file with NO size limit,
# which can fill the host disk and OOM-kill it. Every service below inherits
# this via `<<: *maop_logging`.
x-logging: &maop_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ── PostgreSQL (production) ────────────────────────────────────────────────────────────
  # 单机 PG（默认）：向后兼容，无 HA。适用于小规模部署或 staging。
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maop
      POSTGRES_USER: maop
      POSTGRES_PASSWORD: ${MAOP_PG_PASSWORD:?Set MAOP_PG_PASSWORD in .env for production}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maop -d maop"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # OPS-19 fix: bound Postgres memory so a runaway query cannot OOM-kill
    # the host. OPS-20 fix: inherit log rotation.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *maop_logging
    networks:
      - maop-net

  # ── Patroni PG 高可用集群（--profile patroni）─────────────────────────────────────────
  # G-14: 3 节点 Patroni + etcd DCS + HAProxy 读写分离。
  # 启用：docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile patroni up -d
  # 配置：deploy/patroni/patroni.yml + deploy/patroni/haproxy.cfg
  # 故障切换文档：docs/runbook.md
  # 注意：启用 patroni profile 后，上方单机 postgres 服务仍会启动（兼容），
  #       但 MAOP 应用应连接 haproxy:5432 而非 postgres:5432。
  patroni1:
    image: ghcr.io/zalando/spilo-16:3.2-p3  # Patroni + PG16 多架构镜像
    container_name: maop-patroni1
    restart: unless-stopped
    environment:
      PATRONI_SCOPE: maop-cluster
      PATRONI_NAME: patroni1
      PATRONI_RESTAPI_USERNAME: patroni
      PATRONI_RESTAPI_PASSWORD: ${PATRONI_API_PASSWORD:?Set PATRONI_API_PASSWORD in .env}
      PATRONI_SUPERUSER_USERNAME: maop
      PATRONI_SUPERUSER_PASSWORD: ${MAOP_PG_PASSWORD:?Set MAOP_PG_PASSWORD in .env}
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_REPLICATION_PASSWORD:?Set PATRONI_REPLICATION_PASSWORD in .env}
      PATRONI_rewind_USERNAME: rewinder
      PATRONI_rewind_PASSWORD: ${PATRONI_REWIND_PASSWORD:?Set PATRONI_REWIND_PASSWORD in .env}
      PATRONI_ETCD_HOST: etcd:2379
      PATRONI_POSTGRESQL_DATA_DIR: /home/postgres/pgdata/pgroot/data
      # MAOP 业务参数
      PATRONI_POSTGRESQL_shared_preload_libraries: vector
      PATRONI_POSTGRESQL_max_connections: "200"
      PATRONI_POSTGRESQL_wal_level: replica
      PATRONI_POSTGRESQL_hot_standby: "on"
      PATRONI_POSTGRESQL_max_wal_senders: "10"
      PATRONI_POSTGRESQL_max_replication_slots: "10"
      # 同步复制（数据零丢失）
      PATRONI_synchronous_mode: "true"
      # 回调通知应用层
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${MAOP_REDIS_PASSWORD:-}
      ALERTMANAGER_URL: ${ALERTMANAGER_URL:-}
    volumes:
      - patroni1-data:/home/postgres/pgdata
      - ./deploy/patroni/hooks:/patroni/hooks:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *maop_logging
    depends_on:
      etcd:
        condition: service_healthy
    profiles: ["patroni"]
    networks:
      - maop-net

  patroni2:
    image: ghcr.io/zalando/spilo-16:3.2-p3
    container_name: maop-patroni2
    restart: unless-stopped
    environment: &patroni-env
      PATRONI_SCOPE: maop-cluster
      PATRONI_NAME: patroni2
      PATRONI_RESTAPI_USERNAME: patroni
      PATRONI_RESTAPI_PASSWORD: ${PATRONI_API_PASSWORD:?Set PATRONI_API_PASSWORD in .env}
      PATRONI_SUPERUSER_USERNAME: maop
      PATRONI_SUPERUSER_PASSWORD: ${MAOP_PG_PASSWORD:?Set MAOP_PG_PASSWORD in .env}
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${PATRONI_REPLICATION_PASSWORD:?Set PATRONI_REPLICATION_PASSWORD in .env}
      PATRONI_rewind_USERNAME: rewinder
      PATRONI_rewind_PASSWORD: ${PATRONI_REWIND_PASSWORD:?Set PATRONI_REWIND_PASSWORD in .env}
      PATRONI_ETCD_HOST: etcd:2379
      PATRONI_POSTGRESQL_DATA_DIR: /home/postgres/pgdata/pgroot/data
      PATRONI_POSTGRESQL_shared_preload_libraries: vector
      PATRONI_POSTGRESQL_max_connections: "200"
      PATRONI_POSTGRESQL_wal_level: replica
      PATRONI_POSTGRESQL_hot_standby: "on"
      PATRONI_POSTGRESQL_max_wal_senders: "10"
      PATRONI_POSTGRESQL_max_replication_slots: "10"
      PATRONI_synchronous_mode: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${MAOP_REDIS_PASSWORD:-}
      ALERTMANAGER_URL: ${ALERTMANAGER_URL:-}
    volumes:
      - patroni2-data:/home/postgres/pgdata
      - ./deploy/patroni/hooks:/patroni/hooks:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *maop_logging
    depends_on:
      etcd:
        condition: service_healthy
    profiles: ["patroni"]
    networks:
      - maop-net

  patroni3:
    image: ghcr.io/zalando/spilo-16:3.2-p3
    container_name: maop-patroni3
    restart: unless-stopped
    environment:
      <<: *patroni-env
      PATRONI_NAME: patroni3
    volumes:
      - patroni3-data:/home/postgres/pgdata
      - ./deploy/patroni/hooks:/patroni/hooks:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *maop_logging
    depends_on:
      etcd:
        condition: service_healthy
    profiles: ["patroni"]
    networks:
      - maop-net

  # HAProxy 读写分离 + Patroni REST API 代理
  pg-haproxy:
    image: haproxy:2.9-alpine
    container_name: maop-pg-haproxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"   # 写（primary）
      - "127.0.0.1:5433:5433"   # 读（primary + replica，轮询）
      - "127.0.0.1:7000:7000"   # 统计面板
    volumes:
      - ./deploy/patroni/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 10s
      retries: 3
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging: *maop_logging
    depends_on:
      patroni1:
        condition: service_healthy
      patroni2:
        condition: service_healthy
      patroni3:
        condition: service_healthy
    profiles: ["patroni"]
    networks:
      - maop-net

  # ── HashiCorp Vault (production secrets backend) ────────────────
  # OPS-15 fix: TLS enabled (no more cleartext secrets on the docker
  # network) + pinned image tag (no :latest supply-chain risk in prod).
  # Generate certs before first start, e.g.:
  #   mkdir -p certs/vault && openssl req -x509 -newkey rsa:4096 -nodes \
  #     -keyout certs/vault/vault.key -out certs/vault/vault.crt \
  #     -days 825 -subj "/CN=vault" -addext "subjectAltName=DNS:vault"
  # OPS-16 fix: healthcheck via `vault status` (exit 0 only when
  # initialized AND unsealed) + dashboard waits on service_healthy.
  # First deployment still requires one-time manual init/unseal:
  #   docker compose exec vault vault operator init
  #   docker compose exec vault vault operator unseal   (x3)
  # (Auto-unseal via cloud KMS is recommended for real production; see
  #  Vault docs "seal" stanza.)
  vault:
    image: hashicorp/vault:1.17
    environment:
      VAULT_LOCAL_CONFIG: |
        storage "file" { path = "/vault/data" }
        listener "tcp" {
          address = "0.0.0.0:8200"
          tls_cert_file = "/vault/certs/vault.crt"
          tls_key_file = "/vault/certs/vault.key"
        }
        api_addr = "https://vault:8200"
      VAULT_ADDR: https://127.0.0.1:8200
    volumes:
      - vault-data:/vault/data
      - vault-logs:/vault/logs
      - ./certs/vault:/vault/certs:ro
    ports: []  # P2 fix: Vault internal only

    healthcheck:
      # exit 0 = initialized + unsealed; 2 = sealed; 1 = error
      test: ["CMD", "vault", "status", "-tls-skip-verify"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    # OPS-19 fix: bound Vault memory. OPS-20 fix: inherit log rotation.
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *maop_logging
    networks:
      - maop-net

  # ── Redis (cache/queue/HA) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${MAOP_REDIS_PASSWORD:?Set MAOP_REDIS_PASSWORD in .env for production}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${MAOP_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # OPS-19 fix: bound Redis memory (maxmemory policy set by upstream image
    # is insufficient without a hard container limit). OPS-20 fix: inherit.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *maop_logging
    networks:
      - maop-net

  dashboard:
    build:
      context: .
      dockerfile: py/Dockerfile
    container_name: maop-app
    restart: unless-stopped
    ports: []  # P2 fix: no direct port exposure, access via nginx only
    environment:
      - MAOP_ENV=production
      - MAOP_ROOT=/app
      - MAOP_AUTH=${MAOP_AUTH:-1}
      - MAOP_JWT_SECRET=${MAOP_JWT_SECRET:?Set MAOP_JWT_SECRET in .env}
      - MAOP_TLS=${MAOP_TLS:-0}
      - MAOP_JSON_LOG=1
      - MAOP_OTEL_ENABLED=${MAOP_OTEL_ENABLED:-0}
      - MAOP_STORAGE_BACKEND=postgresql
      - MAOP_PG_HOST=postgres
      - MAOP_PG_DATABASE=maop
      - MAOP_PG_USER=maop
      - MAOP_PG_PASSWORD=${MAOP_PG_PASSWORD:?Set MAOP_PG_PASSWORD in .env for production}
      - MAOP_SECRET_BACKEND=vault
      # OPS-15 fix: Vault now serves TLS; CA/cert verification uses the
      # mounted cert (self-signed) or a real CA in front of it.
      - MAOP_VAULT_ADDR=https://vault:8200
      - MAOP_VAULT_CACERT=/app/certs/vault/vault.crt
      - MAOP_VAULT_TOKEN=${MAOP_VAULT_TOKEN:?Set MAOP_VAULT_TOKEN in .env for production}
      - MAOP_CACHE_BACKEND=redis
      - MAOP_QUEUE_BACKEND=redis
      - MAOP_HA_BACKEND=redis
      - MAOP_REDIS_HOST=redis
      - MAOP_REDIS_PASSWORD=${MAOP_REDIS_PASSWORD:-}
    volumes:
      - maop-data:/app/data
      - maop-config:/app/config
      - maop-logs:/app/logs
      - ./certs/vault:/app/certs/vault:ro  # OPS-15 fix: Vault CA cert
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9079/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    # OPS-20 fix: inherit log rotation.
    logging: *maop_logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

      vault:
        # OPS-16 fix: wait until vault is initialized AND unsealed
        # (healthcheck `vault status` exits 0 only in that state),
        # instead of service_started which guaranteed a crash-loop
        # on fresh deployments.
        condition: service_healthy
    networks:
      - maop-net

  nginx:
    image: nginx:alpine
    container_name: maop-nginx
    restart: unless-stopped
    # OPS-19 fix: bound nginx. OPS-20 fix: inherit log rotation.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging: *maop_logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - nginx-certs:/etc/nginx/certs
    depends_on:
      - dashboard  # fix: base compose service is "dashboard", not "maop"
    networks:
      - maop-net

  prometheus:
    image: prom/prometheus:v2.53.0  # OPS-18 fix: pin tag (was :latest)
    container_name: maop-prometheus
    restart: unless-stopped
    # OPS-19 fix: bound Prometheus (TSDB can grow large). OPS-20 fix: inherit.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *maop_logging
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9090:9090"  # P2 fix: bind to localhost only
    networks:
      - maop-net

  grafana:
    image: grafana/grafana:11.1.0  # OPS-18 fix: pin tag (was :latest)
    container_name: maop-grafana
    restart: unless-stopped
    # OPS-19 fix: bound Grafana. OPS-20 fix: inherit log rotation (was a
    # per-service inline block; now references the shared anchor).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *maop_logging
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env for production}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"  # P2 fix: bind to localhost only
    depends_on:
      - prometheus
    networks:
      - maop-net

  # ── Optional: RabbitMQ queue backend (--profile rabbitmq) ───────
  # 4.7 fix: README documents RabbitMQ as an optional queue backend
  # (MAOP_QUEUE_BACKEND=rabbitmq, needs optional `pika` dep). Provide a
  # pinned, resource-bounded service so the documented capability is
  # actually deployable. Off by default — opt in with:
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
  #     --profile rabbitmq up -d
  rabbitmq:
    image: rabbitmq:3.13-management-alpine  # pinned; :latest is a supply-chain risk
    container_name: maop-rabbitmq
    restart: unless-stopped
    # OPS-19/OPS-20 fix: resource limit + inherited log rotation.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *maop_logging
    environment:
      - RABBITMQ_DEFAULT_USER=${MAOP_RABBITMQ_USER:-maop}
      - RABBITMQ_DEFAULT_PASS=${MAOP_RABBITMQ_PASSWORD:?Set MAOP_RABBITMQ_PASSWORD in .env for production}
    ports:
      - "127.0.0.1:15672:15672"  # management UI, localhost only
    volumes:
      - mq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    profiles: ["rabbitmq"]
    networks:
      - maop-net

  # ── Optional: etcd distributed KV backend (--profile etcd) ──────
  # 4.7 fix: README documents etcd as an optional KV backend
  # (MAOP_KV_BACKEND=etcd, needs optional `etcd3` dep). Off by default.
  # G-14: also serves as DCS for Patroni when --profile patroni is enabled.
  etcd:
    image: quay.io/coreos/etcd:v3.5.14  # pinned
    container_name: maop-etcd
    restart: unless-stopped
    # OPS-19/OPS-20 fix: resource limit + inherited log rotation.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *maop_logging
    environment:
      ETCD_NAME: maop-etcd
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      # Patroni 集群选举需要 v2 API（Patroni 兼容 v2 与 v3，默认 v3）
      ALLOW_NONE_AUTHENTICATION: "yes"
    ports:
      - "127.0.0.1:2379:2379"  # localhost only
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    # 同时支持 etcd KV backend 与 Patroni DCS 两个 profile
    profiles: ["etcd", "patroni"]
    networks:
      - maop-net

volumes:
  maop-data:
  maop-config:
  maop-logs:
  nginx-certs:
  prometheus-data:
  grafana-data:
  pg-data:
  # G-14: Patroni 集群持久化卷
  patroni1-data:
  patroni2-data:
  patroni3-data:
  redis-data:
  vault-data:
  vault-logs:
  mq-data:
  etcd-data:

networks:
  maop-net:
    driver: bridge
