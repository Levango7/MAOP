# DAG Workflow Definition — YAML format
# Stored in: F:\Nexus\MAOP\data\dags\

workflow:
  id: "multi-stage-review"
  name: "多阶段代码审查 + 修复"
  version: "1.0"
  
  # 全局默认值
  defaults:
    timeout_s: 60
    retry: 2
  
  nodes:
    # ── STAGE 1: 分析（并行 fan-out） ──
    - id: plan
      type: plan
      agent: claude
      params:
        task: "{{ task }}"  # 占位符，运行时注入
    
    - id: security-scan
      type: execute
      agent_slot: "security"  # 从路由表选 agent，不硬编码
      depends_on: [plan]
      params:
        task: "Review code security:\n{{ plan.output }}"
    
    - id: logic-review
      type: execute
      agent_slot: "review"
      depends_on: [plan]
      params:
        task: "Review code logic:\n{{ plan.output }}"
    
    # ── STAGE 2: 聚合（同步屏障） ──
    - id: consolidate
      type: execute
      agent: claude
      depends_on: [security-scan, logic-review]
      params:
        task: |
          Consolidate these findings:
          Security: {{ security-scan.output }}
          Logic: {{ logic-review.output }}
    
    # ── STAGE 3: 验证 + 条件分支 ──
    - id: verify
      type: verify
      agent: mavis-verifier
      depends_on: [consolidate]
    
    - id: decide
      type: condition  # 条件节点，不走 agent
      depends_on: [verify]
      condition: "{{ verify.passed }} == false"
      branches:
        true: fix-critical    # 验证不通过 → 修复
        false: report-success  # 验证通过 → 完成
    
    - id: fix-critical
      type: execute
      agent_slot: "quickfix"
      depends_on: [decide]
      params:
        task: "Fix issues:\n{{ consolidate.output }}"
    
    - id: final-verify
      type: verify
      agent: mavis-verifier
      depends_on: [fix-critical]
    
    - id: report-success
      type: terminal
      depends_on: [decide, final-verify]
      output: |
        ## 审查报告
        - 安全: {{ security-scan.output | truncate(200) }}
        - 逻辑: {{ logic-review.output | truncate(200) }}
        - 最终结论: {{ final-verify.output }}
