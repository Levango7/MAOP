[project]
name = "maop"
version = "4.0.0"
description = "MAOP - Multi-Agent Orchestration Framework (Python-first, Plan-Execute-Verify)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyyaml==6.0.2",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "httpx>=0.27.0,<1.0",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "mmh3==5.2.1",
    "numpy>=1.24.0",
    "cryptography>=42.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "alembic>=1.13.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "PyJWT>=2.8.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
    "pydantic-settings==2.5.2",
    "mmh3==5.2.1",
    "httpx>=0.27.0,<1.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0",
    "pytest-timeout>=2.3",
    "mypy>=1.10",
]
ml = [
    "sentence-transformers>=2.0",
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
enterprise = [
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
]

[project.scripts]
maop = "maop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "maop.dashboard.routers.*"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "maop.cli"
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "contract: API contract tests between frontend and backend",
    "slow: stress / concurrency / load tests (exclude with -m 'not slow')",
]
