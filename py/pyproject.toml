[project]
# PyPI 包名改为 maop-orchestrator（原 `maop` 被 Justin Ryan 2021-07-09 注册为 0.0.0）。
# import 名仍为 `maop`（由 [tool.hatch.build.targets.wheel] packages 指定）。
name = "maop-orchestrator"
version = "5.1.0"
description = "MAOP - Multi-Agent Orchestration Framework (Python-first, Plan-Execute-Verify)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0.2,<7.0.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings==2.5.2",
    "python-dotenv>=1.2.2",
    "httpx>=0.27.0,<1.0",
    "fastapi>=0.141.1,<0.142",
    "uvicorn[standard]==0.30.6",
    "mmh3==5.2.1",
    # 5.2 fix: cap upper bounds so a future major release cannot silently
    # break the ABI / asyncio behaviour the code relies on.
    # - numpy 3.0 changed the C ABI; pin below 3.0.
    "numpy>=1.24.0,<3.0",
    # - P0-C CVE audit (2026-08-26): floor raised to 50.0 — PYSEC-2026-3552
    #   needs >=50.0.0 (also fixes PYSEC-2026-3553/3554 at >=49.0.0 and
    #   GHSA-537c-gmf6-5ccf at >=48.0.1). cryptography 50 supports Python
    #   >=3.9, compatible with requires-python >=3.10.
    "cryptography>=50.0,<51",
    "aiosqlite>=0.20.0",
    # - P0-C CVE audit (2026-08-26): floor raised to 0.0.31 —
    #   PYSEC-2026-3036/3037 fixed in 0.0.30, PYSEC-2026-3040 in 0.0.31.
    "python-multipart>=0.0.31",
    "alembic>=1.13.0",
    # - P0-C CVE audit (2026-08-26): floor raised to 3.14.3 — covers all 14
    #   aiohttp CVEs reported against 3.13.5 (fixes span 3.14.0 ~ 3.14.3,
    #   highest being PYSEC-2026-3545/CVE-2026-69244).
    "aiohttp>=3.14.3",
    # - websockets 14+ made breaking asyncio changes; cap below 15.
    "websockets>=12.0,<15",
    # - P0-C CVE audit (2026-08-26): floor raised to 2.13.0 — fixes
    #   PYSEC-2026-175..179 (CVE-2026-48522..48526), all patched in 2.13.0.
    "PyJWT>=2.13.0",
    "packaging>=24.0",
    # P1-5 fix: sqlite-vec is now a default dependency (was optional).
    # Provides ~100x faster ANN vector search via SQLite virtual table extension.
    # Falls back to NumPy → pure-Python cosine if the extension fails to load.
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # P2-7: pytest-xdist for parallel test execution (-n auto in addopts).
    "pytest-xdist>=3.5",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
    "pydantic-settings==2.5.2",
    "mmh3==5.2.1",
    "httpx>=0.27.0,<1.0",
    "python-multipart>=0.0.31",
    "aiosqlite>=0.20.0",
    "pytest-timeout>=2.3",
    # P2-4: pytest-rerunfailures for flaky test retry (CI -n auto 并行场景下
    # 偶发重试)。原 ci.yml 手工罗列，现移入 dev extra 统一管理。
    "pytest-rerunfailures>=11.0",
    "mypy>=1.10",
    # Test-only hard deps: tests/test_distributed_execution.py imports fakeredis
    # (mock Redis, no real server); tests/test_enterprise_integration.py imports
    # lxml + defusedxml for SAML XML handling. All were implicit via
    # requirements.lock but must be declared here since CI installs editable.
    "fakeredis>=2.23",
    # P0-C CVE audit (2026-08-26): lxml >=6.1.0 fixes PYSEC-2026-87 (CVE-2026-41066).
    "lxml>=6.1.0",
    "defusedxml>=0.7.1",
]


ml = [
    "sentence-transformers>=2.0",
    # P1-5: HNSW index for ≥100K-vector datasets. Optional because the
    # native build (hnswlib) requires a C++ toolchain at install time.
    # When absent, VectorStore falls back to sqlite-vec → NumPy → pure Python.
    "hnswlib>=0.8.0",
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
enterprise = [
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.1",
    "asyncpg>=0.29",
    "redis>=5.0",
    # 5.3 fix: pika (RabbitMQ queue backend) was previously missing from
    # this extra, so `pip install maop-orchestrator[enterprise]` left the optional
    # backends permanently falling back to Redis/SQLite.
    "pika>=1.3",
    # SAML SSO (enterprise/saml_handler.py) + sso integration tests require lxml.
    # P0-C CVE audit (2026-08-26): >=6.1.0 fixes PYSEC-2026-87 (CVE-2026-41066);
    # this extra is the only lxml constraint for `pip install maop-orchestrator[enterprise]`.
    "lxml>=6.1.0",
]
# P0-2 fix (2026-08-16): etcd3 移出 enterprise extra —— upstream 2019 年
# 停更、含已知 CVE、Python≥3.13 无法安装，留在 enterprise 会导致付费用户
# `pip install maop-orchestrator[enterprise]` 直接失败。需要 etcd KV 后端时显式安装
# maop[etcd]（不推荐生产使用，见 SECURITY.md）。
etcd = [
    "etcd3>=0.12 ; python_version < '3.13'",
]
# P2-10: xmlsec for SAML XML signature verification/encryption.
# Required by enterprise/saml_handler.py for production SSO deployments.
# Kept optional because the native build needs libxmlsec1 at install time.
saml = [
    "xmlsec>=1.3.0",
]
# P1-6: SQLite→PostgreSQL migration tooling. Adds the PG driver stack needed
# by maop.migrations.pg (Alembic), maop.migrations.sqlite_to_pg (SQLAlchemy
# 2.0 sync engines), and the pgvector extension for ANN vector search.
# SQLAlchemy is pulled in via the main deps' alembic transitive, but we pin
# it explicitly here so the [postgresql] extra is self-contained.
postgresql = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pgvector>=0.3",
]

[project.scripts]
maop = "maop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 包名 maop-orchestrator 与 import 名 maop 不同，需显式指定包目录。
# 否则 hatchling 会找 maop_orchestrator/ 目录（不存在）。
[tool.hatch.build.targets.wheel]
packages = ["maop"]

# ADR-017: 双仓库物理隔离 — enterprise/ 模块已移至私有仓库 Levango7/MAOS。
# H3 修复：原 [tool.hatch.build] exclude = ["maop/enterprise"] 配置指向不存在的
# 目录，且与覆盖率门禁的 `if: import maop.enterprise` 条件共同导致门禁永远
# 跳过。enterprise/ 目录已不在本代码树中，exclude 配置冗余且具误导性，移除之。
# 若未来 enterprise/ 重新引入本仓库，需恢复此 exclude 配置。

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# BLE001: MAOP 高容错设计, except Exception 是有意的防御性兜底
# S110: 非关键路径(metrics/span)的静默兜底, 关键路径已在 R7 阶段改为 logger
# E402: 模块导入顺序灵活(条件导入、副作用模块)
# F403: analyzer/__init__.py 的 TYPE_CHECKING re-export 需要 wildcard import;
#   ruff 0.16+ 默认不再启用 F403, 0.15 仍启用 —— 显式 ignore 统一两版本行为
ignore = ["E402", "BLE001", "S110", "F403"]

# __init__.py 中的 re-export（from module import Name）是子包公开 API 的有意设计，
# ruff F401 会误报为 unused-import。对 __init__.py 豁免 F401。
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"  # 3.10→3.12: numpy .pyi stubs use 3.12+ syntax; on 3.10 mypy aborts parsing stubs and the type-check gate is dead. Codebase stays 3.10-compatible.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
# P0-2 fix (2026-08-16): warn_unused_ignores 关闭 —— mypy 结果随依赖 stub
# 版本浮动（pip 解析时间不同 → cryptography/redis types 变化），未使用的
# ignore 在不同环境下时有时无。关闭后 ignore 只在"确实多余"时不报错，
# 真实类型错误仍正常拦截（22 处真实修复保留）。
warn_unused_ignores = false
warn_no_return = true
strict_optional = true
ignore_missing_imports = true

# T2 Mixin 拆分后：Mixin 类通过组合类（ThreeLayerMemory/EvolutionLoop/MCPHub）
# 获得宿主属性（self._root/_db_connect 等），mypy 无法静态推断这些属性。
# 对 Mixin 模块豁免 attr-defined（组合模式的已知限制，宿主属性由 __init__ 保证）。
[[tool.mypy.overrides]]
module = [
    "maop.core.memory.working_memory",
    "maop.core.memory.semantic",
    "maop.core.memory.transform",
    "maop.core.memory.episodic_store",
    "maop.core.memory.episodic_consolidation",
    "maop.core.memory.protocol_aliases",
    "maop.core.evolution.evolution_collectors",
    "maop.core.evolution.evolution_analyzers",
    "maop.core.evolution.evolution_agent",
    "maop.core.evolution.evolution_phases",
    "maop.core.mcp.mcp_hub_metrics",
    "maop.core.mcp.mcp_hub_ops",
    "maop.core.mcp.mcp_hub_compat",
    # P2 maop_loop.py 拆分：PhasesMixin 通过 MaopLoop 组合获得
    # _execute_with_strategy/_execute_with_retry 等宿主属性。
    "maop.maop_loop_phases",
    # Phase 3-2 ldap_provider.py 拆分：LDAPSearchMixin 通过 LDAPProvider
    # 组合获得 self.config / self._connect() / self._close() 等宿主属性。
    "maop.core.security.ldap_search",
]
disable_error_code = ["attr-defined"]

# P0-3 DataProxy Mixin 拆分：channels/*.py 中的 Mixin（SkillsMixin/McpMixin/...）
# 通过 DataProxy 组合获得宿主属性（self._root/_query_maop/_record_latency 等），
# mypy 无法静态推断。豁免 attr-defined（宿主属性）+ has-type（_tool_mgr 等惰性属性）
# + no-any-return（attr-defined 连锁：属性未定义 → 返回推断为 Any）。
# 与上方 T2 Mixin 豁免同一模式，宿主属性由 DataProxy.__init__ 保证。
[[tool.mypy.overrides]]
module = [
    "maop.dashboard.channels.skills",
    "maop.dashboard.channels.mcp",
    "maop.dashboard.channels.models",
    "maop.dashboard.channels.prompts",
    "maop.dashboard.channels.routing",
    "maop.dashboard.channels.security",
]
disable_error_code = ["attr-defined", "has-type", "no-any-return"]

[[tool.mypy.overrides]]
module = "maop.dashboard.routers.*"
disable_error_code = ["arg-type", "return-value", "no-any-return"]

[[tool.mypy.overrides]]
module = "maop.cli"
disable_error_code = ["arg-type"]

# P2-4: mypy strict 分阶段启用 — 新模块（v5.0.0 引入）强制完整类型注解，
# 旧模块保持宽松配置（disallow_untyped_defs = false，见上方 [tool.mypy]）。
# 后续版本逐步将旧模块迁移到此覆盖列表。
[[tool.mypy.overrides]]
module = [
    "maop.core.observability.*",
    "maop.core.scheduling.*",
    "maop.core.vector.*",
    "maop.core.evolution.*",
    "maop.core.plugins.*",
    "maop.core.tenant.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# opentelemetry 包通过 __getattr__ 动态导出子模块 (trace, baggage, context 等),
# mypy 无法静态解析, 需要 disable_error_code 避免 attr-defined 误报。
[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 覆盖率门禁: 实测全量覆盖率 82% (2026-08-21 核实, 42367 语句 / 7748 未覆盖)。
# 早期 baseline 18.54% 是过时快照, 已修正。覆盖率门禁改由 CI 中的 ratchet 脚本
# (scripts/check_coverage_ratchet.py, FLOOR=80) 渐进管理:每次 PR 只允许 ↑ 不允许 ↓,
# 从 80% 起步逐迭代抬升到长期目标 90%+。本地不加 --cov-report=xml（CI 专用)
# 也不加 --ignore=tests/contract（保持本地能跑全部测试）。
# P2-7: -n auto 启用 pytest-xdist 并行测试（需安装 pytest-xdist，已在 [dev] extra 中）。
addopts = "-n auto --cov=maop --cov-report=term-missing"
markers = [
    "contract: API contract tests between frontend and backend",
    "slow: stress / concurrency / load tests (exclude with -m 'not slow')",
    "integration: integration tests requiring external services (e.g. PostgreSQL)",
    "serial: tests that bind a fixed port or hammer shared server/app state; must run serially (no -n). Selected by CI's serial step (-n 0).",
]
