# MAOP PostgreSQL Alembic Configuration
#
# Manages the PostgreSQL schema for MAOP when MAOP_DB_BACKEND=postgresql.
# The sqlalchemy.url is overridden by env.py (MAOP_DATABASE_URL env var or
# default postgresql://localhost:5432/maop).
#
# Usage:
#   pip install maop-orchestrator[postgresql]
#   export MAOP_DATABASE_URL=postgresql+psycopg2://user:pass@host:5432/maop
#   alembic -c py/maop/migrations/pg/alembic.ini upgrade head
#
# Or via the CLI:
#   maop migrate pg-init

[alembic]
script_location = py/maop/migrations/pg
sqlalchemy.url = postgresql+psycopg2://localhost:5432/maop

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S